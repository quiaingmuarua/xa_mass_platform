server:
  port: ${XA_MASS_AGENTFORGE_SERVER_PORT:18182}

xa:
  mass:
    kernel-pacer:
      preset: ${XA_MASS_KERNEL_PACER_PRESET:DEFAULT}
    redis:
      scope: ${XA_MASS_REDIS_SCOPE:profile_agentforge}
    worker-delivery:
      adapter:
        instances:
          agentforge-websocket:
            type: WEBSOCKET
            listen-host: 127.0.0.1
            listen-port: ${XA_MASS_AGENTFORGE_ADAPTER_PORT:18183}
            route-cache:
              reconnect-verification-retention: 10m
              maximum-disconnected-workers: 100000
            properties-cache:
              maximum-encoded-bytes: 67108864
            processes:
              - type: DELIVERY_COMMAND
                interval: 100ms
                consume-limit: 100
                queue-capacity: 1000
              - type: DELIVERY_REPORT
                interval: 1s
                queue-capacity: 1000
    worker-binding:
      endpoints:
        agentforge-websocket:
          transport-type: WEBSOCKET
          public-uri: ws://127.0.0.1:${XA_MASS_AGENTFORGE_ADAPTER_PORT:18183}/api/v1/worker-delivery/websocket
    worker-assembly:
      group-config-json: '{}'
