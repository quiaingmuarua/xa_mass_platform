server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 18082

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  web:
    resources:
      static-locations: file:../frontend/dist/

xa:
  mass:
    kernel:
      base-url: http://127.0.0.1:18080
      connect-timeout: 1s
      read-timeout: 5s
    kernel-redis:
      redis-url: redis://localhost:6379/15
      redis-prefix: default
    worker-property-index:
      registry-json: '${XA_MASS_WORKER_PROPERTY_INDEX_REGISTRY_JSON:{}}'
    worker-binding:
      endpoints:
        system-polling:
          transport-type: POLLING
          public-uri: http://127.0.0.1:${server.port:18082}
    task-rpc:
      default-wait-timeout-millis: 30000
      max-wait-timeout-millis: 60000
      max-waiters: 10000
      initial-probe-interval-millis: 50
      normal-probe-interval-millis: 100
      long-probe-interval-millis: 250
      wake-buffer-capacity: 10000
      wake-batch-limit: 100
    direct-call:
      default-wait-timeout-millis: 3000
      max-wait-timeout-millis: 10000
      max-adapter-commands-per-adapter: 1000
      max-pending-calls: 10000
    worker-delivery:
      adapter:
        http-client:
          base-url: http://127.0.0.1:${server.port:18082}
          request-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,kernel,kernelRedis

springdoc:
  paths-to-match: /api/v1/**

scalar:
  enabled: true
  path: /scalar
  url: /v3/api-docs
  page-title: XA Mass Runtime API
  with-default-fonts: false
  telemetry: false
  agent:
    disabled: true
