server:
  port: 18082

xa:
  mass:
    kernel:
      base-url: http://127.0.0.1:18080
      connect-timeout: 1s
      read-timeout: 5s
    kernel-redis:
      redis-url: redis://localhost:6379/15
      redis-prefix: default
    worker-delivery:
      websocket:
        enabled: false
        endpoint-manager-id: ""
        pump-interval: 100ms
        scan-count: 100
        result-batch-size: 100
        result-buffer-capacity: 1000
        send-time-limit: 5s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,kernel,kernelRedis
