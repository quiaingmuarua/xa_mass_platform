server:
  port: 18082

xa:
  mass:
    kernel:
      base-url: http://127.0.0.1:18080
      connect-timeout: 1s
      read-timeout: 5s
    worker-delivery:
      redis-url: redis://localhost:6379/15
      redis-prefix: default

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,kernel,workerDeliveryRedis
