import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id 'org.springframework.boot'
}

base {
    archivesName.set('xa-mass-server-jvm')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.0'
    implementation 'com.scalar.maven:scalar-webmvc:0.6.60'
    implementation project(':kernel_jvm')
    implementation project(':scenario_workers_jvm')
    implementation project(':transport:netty-adapter')
    implementation project(':worker_delivery_contract_jvm')

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(':transport:java-worker')
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'redis-owner', 'runtime-boundary'
    }
}

def registerStrictIntegrationTest = {
    String taskName,
    String descriptionText,
    String tag,
    List<String> requiredEnvironment ->
    tasks.register(taskName, Test) {
        description = descriptionText
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags tag
        }
        shouldRunAfter tasks.named('test')
        outputs.upToDateWhen { false }

        doFirst {
            requiredEnvironment.each { variableName ->
                String value = System.getenv(variableName)
                if (value == null || value.isBlank()) {
                    throw new GradleException(
                            taskName
                                    + ' requires environment variable '
                                    + variableName
                    )
                }
            }
        }

        afterSuite { descriptor, result ->
            if (descriptor.parent != null) {
                return
            }
            if (result.testCount == 0) {
                throw new GradleException(
                        taskName + ' did not execute any tests'
                )
            }
            if (result.skippedTestCount != 0) {
                throw new GradleException(
                        taskName
                                + ' skipped '
                                + result.skippedTestCount
                                + ' tests'
                )
            }
        }
    }
}

registerStrictIntegrationTest(
        'redisOwnerIntegrationTest',
        'Runs Server-owned and Kernel-owner Redis contract proofs.',
        'redis-owner',
        ['KERNEL_DESIGN_REDIS_URL']
)

registerStrictIntegrationTest(
        'runtimeBoundaryIntegrationTest',
        'Runs the Java Server boundary against Redis and the Python Kernel.',
        'runtime-boundary',
        [
                'KERNEL_DESIGN_REDIS_URL',
                'KERNEL_COMMAND_INTEGRATION_URL'
        ]
)
