pluginManagement {
    repositories {
        google()
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'xa-mass-platform'

include ':kernel_jvm'
include ':scenario_rpc_jvm'
include ':scenario_workers_jvm'
include ':server_jvm'
include ':worker_delivery_contract_jvm'
include ':transport:worker-core'
include ':transport:netty-adapter'
include ':transport:java-worker'
include ':transport:android-worker'
include ':integrations:worker-capability-rpc'
include ':integrations:android-websocket-worker'
