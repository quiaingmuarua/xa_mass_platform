plugins { id 'application' }
version = '0.1.0-preview'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
application { mainClass = 'com.xa.mass.sms.simulator.SimulatorMain' }
dependencies {
    implementation project(':transport:java-worker')
    implementation project(':transport:worker-core')
    implementation project(':transport:worker-delivery-contract')
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }
