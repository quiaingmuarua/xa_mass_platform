plugins { id 'base' }
version = '0.1.0-preview'
tasks.register('previewZip', Zip) {
    dependsOn ':distribution:server:bootJar',
            ':scenario_workers_jvm:installDist',
            ':distribution:server:buildFrontend',
            ':distribution:server:generatePlatformDiagnosticCodes', 'previewManifest'
    archiveFileName = "sms-reception-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into("sms-reception-${project.version}") {
        from('run_preview.py')
        from('run_acceptance.py')
        from('README.md')
        from('requirements.txt')
        from('config') { into 'config' }
        from(layout.buildDirectory.file('preview-manifest.json'))
        from(layout.buildDirectory.dir('acceptance')) {
            into 'evidence'
            include 'functional/summary.json', 'functional/summary.md'
            include 'lifecycle/summary.json', 'lifecycle/summary.md'
        }
        from(project(':distribution:server').tasks.named('bootJar')) { into 'lib' }
        from(rootProject.file('frontend/dist')) {
            into 'frontend/dist'
            exclude 'reference/platform-diagnostic-codes.json'
        }
        from(project(':distribution:server').platformDiagnosticCodesFile) { into 'frontend/dist/reference' }
        from(rootProject.file('frontend/LICENSE.pure-admin-thin'))
        from(rootProject.file('frontend/THIRD_PARTY_NOTICES.md')) { rename { 'THIRD_PARTY_NOTICES.frontend.md' } }
        from(project(':scenario_workers_jvm').layout.buildDirectory.dir('install/xa-mass-scenario-workers')) {
            into 'scenario-workers'
        }
    }
}

tasks.register('previewManifest') {
    dependsOn ':distribution:server:bootJar', ':scenario_workers_jvm:jar'
    def output = layout.buildDirectory.file('preview-manifest.json')
    outputs.file(output)
    outputs.upToDateWhen { false }
    doLast {
        def artifacts = [
                server: project(':distribution:server').tasks.named('bootJar').get().archiveFile.get().asFile,
                host: project(':scenario_workers_jvm').tasks.named('jar').get().archiveFile.get().asFile
        ]
        def manifest = [productVersion: project.version.toString(), platformVersion: project(':server_jvm').version.toString(),
                baseCommit: providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim(),
                includesWorktree: true, profile: 'sms-reception', processModel: ['server', 'host'],
                artifacts: artifacts.collectEntries { name, file ->
                    [(name): [file: file.name, sha256: java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()]]
                }]
        output.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n'
    }
}
