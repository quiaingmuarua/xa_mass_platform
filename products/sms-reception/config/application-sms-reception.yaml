server:
  address: 127.0.0.1
  port: ${SMS_SERVER_PORT:18390}
xa:
  mass:
    kernel-pacer:
      enabled: true
      preset: DEFAULT
    redis:
      url: ${XA_MASS_REDIS_URL:redis://127.0.0.1:6379/15}
      scope: ${XA_MASS_REDIS_SCOPE}
    worker-assembly:
      group-config-json: '{}'
    worker-delivery:
      adapter:
        remote-base-url: http://127.0.0.1:${SMS_SERVER_PORT:18390}
        instances:
          sms-websocket:
            type: WEBSOCKET
            listen-host: 127.0.0.1
            listen-port: ${SMS_ADAPTER_PORT:18393}
            command-backoff: 100ms
            command-consume-limit: 100
            command-retry-capacity: 1000
            report-backoff: 100ms
            report-queue-capacity: 10000
            reconnect-verification-retention: 10m
            maximum-disconnected-workers: 10000
            maximum-encoded-properties-bytes: 67108864
            send-time-limit: 5s
            shutdown-timeout: 5s
    worker-endpoints:
      defaults:
        WEBSOCKET: sms-websocket
      endpoints:
        sms-websocket:
          transport-type: WEBSOCKET
          public-uri: ws://127.0.0.1:${SMS_ADAPTER_PORT:18393}/api/v1/worker-delivery/websocket
