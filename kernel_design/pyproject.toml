[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "xa-mass-kernel-pacer"
version = "0.2.0"
description = "XA Mass executable Kernel Pacer runtime"
requires-python = ">=3.11.3,<3.14"
dependencies = [
  "redis==8.0.0",
]

[tool.setuptools]
package-dir = {"" = ".."}
include-package-data = false

[tool.setuptools.packages.find]
where = [".."]
include = [
  "kernel_design",
  "kernel_design.executable_spec",
  "kernel_design.executable_spec.*",
]
exclude = [
  "kernel_design.executable_spec.tests",
  "kernel_design.executable_spec.tests.*",
  "kernel_design.executable_spec.test_support",
  "kernel_design.executable_spec.test_support.*",
]
namespaces = true
