plugins {
    id 'com.android.application'
}

base {
    archivesName.set('xa-mass-android-worker-demo')
}

android {
    namespace = 'com.xa.mass.android.workerdemo'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.xa.mass.integration.androidworker'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
        resValue 'string', 'runtime_api_base_url', providers.gradleProperty('xaMassRuntimeApiBaseUrl')
                .orElse('http://127.0.0.1:18182').get()
    }

    buildTypes {
        lab1 {
            initWith debug
            applicationIdSuffix = '.lab1'
            matchingFallbacks = ['debug']
        }
        lab2 {
            initWith debug
            applicationIdSuffix = '.lab2'
            matchingFallbacks = ['debug']
        }
        lab3 {
            initWith debug
            applicationIdSuffix = '.lab3'
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation "com.xa.mass:xa-mass-android-worker:${project.version}"
    implementation project(':capabilities')
    implementation "com.xa.mass:xa-mass-android-capability-http:${project.version}"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.3.0'
}
