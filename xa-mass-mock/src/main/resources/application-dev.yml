# Development profile overrides for the verified mock runtime.
mass:
  websocket:
    port: 18088
  gateway:
    max-connections: 1000
    enabled: true
  engine:
    worker-threads: 8
    enabled: true
  mock:
    data:
      devices: mock/mock_devices.json
      tasks: mock/mock_tasks.json
      rules: mock/mock_rules.json

server:
  port: 8088

logging:
  level:
    com.xa.mass: DEBUG
    com.xa.mass.starter: INFO
    com.xa.mass.gateway: INFO
    com.xa.mass.engine: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
