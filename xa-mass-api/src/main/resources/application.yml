server:
  port: 8080

spring:
  application:
    name: mass-status-monitor
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML

logging:
  level:
    com.xa.mass: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 自定义配置
mass:
  status:
    refresh-interval: 30000  # 页面自动刷新间隔（毫秒）
    max-tasks-display: 10    # 总览页面最多显示的任务数 