<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>璁惧绠＄悊 - XA Mass Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .device-card {
            transition: transform 0.2s;
        }

        .device-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .status-badge {
            font-size: 0.8em;
            font-weight: bold;
        }

        .app-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .app-tag {
            background-color: #e3f2fd;
            color: #1976d2;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
        }

        .locked-indicator {
            color: #f57c00;
            font-weight: bold;
        }

        .timestamp {
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <!-- 瀵艰埅鏍?-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/status">
                <i class="bi bi-gear-fill me-2"></i>XA Mass Platform
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="/status">鐘舵€佹瑙?/a>
                <a class="nav-link" href="/status/tasks">浠诲姟绠＄悊</a>
                <a class="nav-link active" href="/status/devices">璁惧绠＄悊</a>
                <a class="nav-link" href="/status/rules">瑙勫垯绠＄悊</a>
            </div>
        </div>
    </nav>

    <!-- 椤甸潰鏍囬 -->
    <div class="row mb-4">
        <div class="col">
            <h2><i class="bi bi-phone me-2"></i>璁惧绠＄悊</h2>
            <p class="text-muted">鏌ョ湅鍜岀鐞嗘墍鏈夎澶囧強鍏剁姸鎬?/p>
            <button class="btn btn-success btn-sm" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise"></i> 鍒锋柊鏁版嵁
            </button>
        </div>
    </div>

    <!-- 缁熻鍗＄墖鍖?-->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h4 class="card-title" th:text="${#lists.size(devices)}">0</h4>
                            <p class="card-text">璁惧鎬绘暟</p>
                        </div>
                        <div class="align-self-center">
                            <i class="bi bi-phone fs-1"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3" th:each="status : ${deviceStatuses}">
            <div class="card bg-info text-white mb-2">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h4 class="card-title" th:text="${deviceStatusCount[status] ?: 0}">0</h4>
                            <p class="card-text" th:text="${status.name()}">鐘舵€?/p>
                        </div>
                        <div class="align-self-center">
                            <i class="bi bi-circle-half fs-1"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 璁惧琛ㄦ牸鍒楄〃 -->
    <div class="row">
        <div class="col-12">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>璁惧ID</th>
                    <th>鐘舵€?/th>
                    <th>鍒嗙粍</th>
                    <th>Agent鐗堟湰</th>
                    <th>鏀寔鐨勫簲鐢?/th>
                    <th>閿佸畾鐘舵€?/th>
                    <th>鏈€鍚庡績璺?/th>
                    <th>鍒涘缓鏃堕棿</th>
                    <th>鎿嶄綔</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="device : ${devices}">
                    <td th:text="${device.deviceId}">璁惧ID</td>
                    <td><span class="badge bg-secondary" th:text="${device.status.name()}">鐘舵€?/span></td>
                    <td th:text="${device.deviceGroupId}">-</td>
                    <td th:text="${device.agentVersion}">-</td>
                    <td>
                                <span th:if="${!#lists.isEmpty(device.supportedProjects)}"
                                      th:text="${#strings.arrayJoin(device.supportedProjects, ', ')}">-</span>
                        <span th:if="${#lists.isEmpty(device.supportedProjects)}">-</span>
                    </td>
                    <td>
                        <span class="locked-indicator" th:if="${device.locked}">馃敀 宸查攣瀹?/span>
                        <span th:unless="${device.locked}">鉁?鍙敤</span>
                    </td>
                    <td>
                        <span class="timestamp"
                              th:text="${device.lastHeartbeat != null ? #temporals.format(device.lastHeartbeat, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</span>
                    </td>
                    <td>
                        <span class="timestamp"
                              th:text="${device.createTime != null ? #temporals.format(device.createTime, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" data-bs-target="#editDeviceModal"
                                data-bs-toggle="modal"
                                th:attr="data-device-id=${device.deviceId},data-supported-projects=${#strings.arrayJoin(device.supportedProjects, ',')},data-group-id=${device.deviceGroupId},data-agent-version=${device.agentVersion}">
                            <i class="bi bi-pencil"></i> 缂栬緫
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="text-center text-muted mt-5" th:if="${#lists.isEmpty(devices)}">
                <h4>鏆傛棤璁惧鏁版嵁</h4>
                <p>褰撳墠绯荤粺涓病鏈夎澶囷紝璇峰厛娣诲姞涓€浜涜澶囥€?/p>
            </div>
        </div>
    </div>

    <!-- 缂栬緫璁惧妯℃€佹 -->
    <div aria-hidden="true" aria-labelledby="editDeviceModalLabel" class="modal fade" id="editDeviceModal"
         tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editDeviceModalLabel">缂栬緫璁惧鏀寔鐨勫簲鐢?/h5>
                    <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>
                <div class="modal-body">
                    <form id="editDeviceForm">
                        <input id="editDeviceId" name="deviceId" type="hidden">
                        <div class="mb-3">
                            <label class="form-label">璁惧ID</label>
                            <input class="form-control" id="editDeviceIdDisplay" readonly type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">鍒嗙粍</label>
                            <input class="form-control" id="editGroupIdDisplay" readonly type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Agent鐗堟湰</label>
                            <input class="form-control" id="editAgentVersionDisplay" readonly type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="editSupportedProjects">鏀寔鐨勫簲鐢紙鍙閫夛級</label>
                            <select class="form-select" id="editSupportedProjects" multiple name="supportedProjects">
                                <!-- 閫夐」鐢盝S鍔ㄦ€佸～鍏?-->
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">鍙栨秷</button>
                    <button class="btn btn-primary" id="saveDeviceBtn" type="button">淇濆瓨</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 缂撳瓨鎵€鏈夐」鐩甤ode
    let allProjectCodes = [];

    // 鍔犺浇鎵€鏈夐」鐩甤ode
    function loadAllProjects(callback) {
        if (allProjectCodes.length > 0) {
            callback && callback();
            return;
        }
        fetch('/status/devices/allProjects')
            .then(res => res.json())
            .then(data => {
                allProjectCodes = data;
                callback && callback();
            });
    }

    // 璁惧缂栬緫鎸夐挳鐐瑰嚮锛屽～鍏呮ā鎬佹
    var editDeviceModal = document.getElementById('editDeviceModal');
    editDeviceModal.addEventListener('show.bs.modal', function (event) {
        var button = event.relatedTarget;
        var deviceId = button.getAttribute('data-device-id');
        var supportedProjects = button.getAttribute('data-supported-projects') || '';
        var deviceGroupId = button.getAttribute('data-group-id') || '';
        var agentVersion = button.getAttribute('data-agent-version') || '';
        document.getElementById('editDeviceId').value = deviceId;
        document.getElementById('editDeviceIdDisplay').value = deviceId;
        document.getElementById('editGroupIdDisplay').value = deviceGroupId;
        document.getElementById('editAgentVersionDisplay').value = agentVersion;
        // 鍔犺浇鎵€鏈夐」鐩苟鍥炴樉
        loadAllProjects(function () {
            var select = document.getElementById('editSupportedProjects');
            select.innerHTML = '';
            allProjectCodes.forEach(function (code) {
                var option = document.createElement('option');
                option.value = code;
                option.text = code;
                select.appendChild(option);
            });
            // 璁剧疆宸查€?
            var selected = supportedProjects ? supportedProjects.split(',') : [];
            Array.from(select.options).forEach(function (opt) {
                opt.selected = selected.includes(opt.value);
            });
        });
    });

    // 淇濆瓨鎸夐挳鐐瑰嚮锛孉JAX鎻愪氦
    var saveBtn = document.getElementById('saveDeviceBtn');
    saveBtn.addEventListener('click', function () {
        var deviceId = document.getElementById('editDeviceId').value;
        var select = document.getElementById('editSupportedProjects');
        var selected = Array.from(select.selectedOptions).map(opt => opt.value);
        fetch('/status/devices/updateSupportedProjects', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({deviceId: deviceId, supportedProjects: selected})
        })
            .then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    alert('淇濆瓨澶辫触');
                }
            })
            .catch(() => alert('璇锋眰澶辫触'));
    });
</script>
</body>
</html>
