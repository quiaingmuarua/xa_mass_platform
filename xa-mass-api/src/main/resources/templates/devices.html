<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备管理 - XA Mass Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .device-card {
            transition: transform 0.2s;
        }
        .device-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .status-badge {
            font-size: 0.8em;
            font-weight: bold;
        }
        .app-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .app-tag {
            background-color: #e3f2fd;
            color: #1976d2;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
        }
        .locked-indicator {
            color: #f57c00;
            font-weight: bold;
        }
        .timestamp {
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="/status">
                    <i class="bi bi-gear-fill me-2"></i>XA Mass Platform
                </a>
                <div class="navbar-nav">
                    <a class="nav-link" href="/status">状态概览</a>
                    <a class="nav-link" href="/status/tasks">任务管理</a>
                    <a class="nav-link active" href="/status/devices">设备管理</a>
                    <a class="nav-link" href="/status/rules">规则管理</a>
                </div>
            </div>
        </nav>

        <!-- 页面标题 -->
        <div class="row mb-4">
            <div class="col">
                <h2><i class="bi bi-phone me-2"></i>设备管理</h2>
                <p class="text-muted">查看和管理所有设备及其状态</p>
                <button class="btn btn-success btn-sm" onclick="location.reload()">
                    <i class="bi bi-arrow-clockwise"></i> 刷新数据
                </button>
            </div>
        </div>

        <!-- 统计卡片区 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 class="card-title" th:text="${#lists.size(devices)}">0</h4>
                                <p class="card-text">设备总数</p>
                            </div>
                            <div class="align-self-center">
                                <i class="bi bi-phone fs-1"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3" th:each="status : ${deviceStatuses}">
                <div class="card bg-info text-white mb-2">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 class="card-title" th:text="${deviceStatusCount[status] ?: 0}">0</h4>
                                <p class="card-text" th:text="${status.name()}">状态</p>
                            </div>
                            <div class="align-self-center">
                                <i class="bi bi-circle-half fs-1"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 设备卡片列表 -->
        <div class="row" id="devicesContainer">
            <div class="col-md-6 col-lg-4 mb-3" th:each="device : ${devices}">
                <div class="card device-card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0" th:text="${device.deviceId}">设备ID</h6>
                        <span class="badge bg-secondary" th:text="${device.status.name()}">状态</span>
                    </div>
                    <div class="card-body">
                        <div class="mb-2">
                            <small class="text-muted">分组:</small>
                            <span th:text="${device.groupId}">-</span>
                        </div>
                        <div class="mb-2">
                            <small class="text-muted">Agent版本:</small>
                            <span th:text="${device.agentVersion}">-</span>
                        </div>
                        <div class="mb-2">
                            <small class="text-muted">支持的应用:</small>
                            <span th:if="${!#lists.isEmpty(device.supportedProjects)}">
                                <span class="app-tag" th:each="project : ${device.supportedProjects}" th:text="${project.code}"></span>
                            </span>
                            <span th:if="${#lists.isEmpty(device.supportedProjects)}">-</span>
                        </div>
                        <div class="mb-2">
                            <small class="text-muted">锁定状态:</small>
                            <span th:if="${device.locked}" class="locked-indicator">🔒 已锁定</span>
                            <span th:unless="${device.locked}">✅ 可用</span>
                        </div>
                        <div class="mb-2">
                            <small class="text-muted">最后心跳:</small>
                            <span class="timestamp" th:text="${device.lastHeartbeat != null ? #temporals.format(device.lastHeartbeat, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</span>
                        </div>
                        <div class="mb-2">
                            <small class="text-muted">创建时间:</small>
                            <span class="timestamp" th:text="${device.createTime != null ? #temporals.format(device.createTime, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</span>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(devices)}" class="text-center text-muted mt-5">
                <h4>暂无设备数据</h4>
                <p>当前系统中没有设备，请先添加一些设备。</p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
