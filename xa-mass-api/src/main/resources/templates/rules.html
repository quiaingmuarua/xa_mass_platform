<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>规则管理 - XA Mass Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .rule-card {
            transition: transform 0.2s;
        }
        .rule-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .rule-type-badge {
            font-size: 0.8em;
        }
        .rule-priority {
            font-weight: bold;
        }
        .rule-description {
            color: #6c757d;
            font-size: 0.9em;
        }
        .evaluator-info {
            background-color: #f8f9fa;
            border-radius: 4px;
            padding: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="/status">
                    <i class="bi bi-gear-fill me-2"></i>XA Mass Platform
                </a>
                <div class="navbar-nav">
                    <a class="nav-link" href="/status">状态概览</a>
                    <a class="nav-link" href="/status/tasks">任务管理</a>
                    <a class="nav-link" href="/status/devices">设备管理</a>
                    <a class="nav-link active" href="/status/rules">规则管理</a>
                </div>
            </div>
        </nav>

        <!-- 页面标题 -->
        <div class="row mb-4">
            <div class="col">
                <h2><i class="bi bi-rulers me-2"></i>规则管理</h2>
                <p class="text-muted">查看和管理设备匹配规则</p>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 class="card-title" th:text="${#lists.size(rules)}">0</h4>
                                <p class="card-text">总规则数</p>
                            </div>
                            <div class="align-self-center">
                                <i class="bi bi-rulers fs-1"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 class="card-title" th:text="${#lists.size(registeredEvaluatorTypes)}">0</h4>
                                <p class="card-text">评估器类型</p>
                            </div>
                            <div class="align-self-center">
                                <i class="bi bi-cpu fs-1"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 class="card-title" th:text="${#lists.size(ruleTypes)}">0</h4>
                                <p class="card-text">规则类型</p>
                            </div>
                            <div class="align-self-center">
                                <i class="bi bi-tags fs-1"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-warning text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h4 class="card-title" th:text="${#lists.size(rulesByType)}">0</h4>
                                <p class="card-text">分组数量</p>
                            </div>
                            <div class="align-self-center">
                                <i class="bi bi-collection fs-1"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 规则类型统计 -->
        <div class="row mb-4">
            <div class="col">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-pie-chart me-2"></i>规则类型分布</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6" th:each="ruleType : ${ruleTypes}">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-secondary rule-type-badge" th:text="${ruleType.name()}">QL_EXPRESS</span>
                                    <span class="badge bg-primary" th:text="${#lists.size(rulesByType.get(ruleType)) ?: 0}">0</span>
                                </div>
                                <div class="progress mb-3" style="height: 8px;">
                                    <div class="progress-bar" role="progressbar" 
                                         th:style="'width: ' + ${#lists.size(rulesByType.get(ruleType)) ?: 0} * 100 / ${#lists.size(rules)} + '%'"
                                         th:aria-valuenow="${#lists.size(rulesByType.get(ruleType)) ?: 0}" 
                                         th:aria-valuemax="${#lists.size(rules)}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 规则列表 -->
        <div class="row">
            <div class="col">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-list-ul me-2"></i>规则列表</h5>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="filterRules('all')">全部</button>
                            <button type="button" class="btn btn-outline-primary btn-sm" th:each="ruleType : ${ruleTypes}" 
                                    th:onclick="'filterRules(\'' + ${ruleType.name()} + '\')'"
                                    th:text="${ruleType.name()}">QL_EXPRESS</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row" id="rulesContainer">
                            <div class="col-md-6 col-lg-4 mb-3" th:each="rule : ${rules}">
                                <div class="card rule-card h-100" th:data-rule-type="${rule.type.name()}">
                                    <div class="card-header d-flex justify-content-between align-items-center">
                                        <h6 class="mb-0" th:text="${rule.name}">规则名称</h6>
                                        <span class="badge" 
                                              th:classappend="${rule.type.name() == 'QL_EXPRESS' ? 'bg-primary' : 'bg-secondary'}"
                                              th:text="${rule.type.name()}">QL_EXPRESS</span>
                                    </div>
                                    <div class="card-body">
                                        <p class="rule-description" th:text="${rule.description}">规则描述</p>
                                        <div class="row">
                                            <div class="col-6">
                                                <small class="text-muted">优先级:</small>
                                                <span class="rule-priority" th:text="${rule.priority}">1</span>
                                            </div>
                                            <div class="col-6">
                                                <small class="text-muted">启用:</small>
                                                <span class="badge" th:classappend="${rule.enabled ? 'bg-success' : 'bg-danger'}"
                                                      th:text="${rule.enabled ? '是' : '否'}">是</span>
                                            </div>
                                        </div>
                                        <div class="evaluator-info">
                                            <small class="text-muted">表达式:</small>
                                            <code class="d-block mt-1" th:text="${rule.expression}">表达式内容</code>
                                        </div>
                                    </div>
                                    <div class="card-footer">
                                        <small class="text-muted">ID: </small>
                                        <small th:text="${rule.id}">rule-id</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 评估器信息 -->
        <div class="row mt-4">
            <div class="col">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-cpu me-2"></i>已注册评估器</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4" th:each="evaluatorType : ${registeredEvaluatorTypes}">
                                <div class="card bg-light">
                                    <div class="card-body text-center">
                                        <i class="bi bi-cpu fs-2 text-primary mb-2"></i>
                                        <h6 class="card-title" th:text="${evaluatorType.name()}">QL_EXPRESS</h6>
                                        <p class="card-text text-muted">规则评估器</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function filterRules(ruleType) {
            const rules = document.querySelectorAll('.rule-card');
            rules.forEach(rule => {
                if (ruleType === 'all' || rule.dataset.ruleType === ruleType) {
                    rule.style.display = 'block';
                } else {
                    rule.style.display = 'none';
                }
            });
        }

        // 页面加载完成后自动刷新
        setInterval(() => {
            location.reload();
        }, 30000); // 30秒刷新一次
    </script>
</body>
</html>
