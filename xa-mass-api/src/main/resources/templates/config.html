<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>全局配置 - 任务管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .config-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .project-item {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .project-info {
            flex: 1;
        }

        .project-actions {
            display: flex;
            gap: 10px;
        }

        .default-badge {
            background: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .custom-badge {
            background: #007bff;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">任务管理系统</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/status//tasks">任务管理</a>
                <a class="nav-link" href="/status/devices">设备管理</a>
                <a class="nav-link" href="/status/rules">规则管理</a>
                <a class="nav-link active" href="/config">全局配置</a>
                <a class="nav-link" href="/status">系统状态</a>
            </div>
        </div>
    </nav>

    <div class="row">
        <div class="col-12">
            <h2 class="mb-4">
                <i class="bi bi-gear-fill"></i>
                全局配置
            </h2>

            <!-- 项目管理 -->
            <div class="config-section">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>
                        <i class="bi bi-folder-fill"></i>
                        项目管理
                    </h4>
                </div>
                <div id="projectsList">
                    <!-- 项目列表将通过 JavaScript 动态加载 -->
                    <div class="text-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">加载中...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 其他配置区域 -->
            <div class="config-section">
                <h4>
                    <i class="bi bi-sliders"></i>
                    系统配置
                </h4>
                <p class="text-muted">更多系统配置选项将在这里添加...</p>
            </div>
        </div>
    </div>
</div>

<!-- 新增项目模态框 -->
<div class="modal fade" id="addProjectModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新增项目</h5>
                <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <form id="addProjectForm">
                    <div class="mb-3">
                        <label class="form-label" for="projectCode">项目代码 *</label>
                        <input class="form-control" id="projectCode" placeholder="请输入项目代码，如：myApp" required
                               type="text">
                        <div class="form-text">项目代码必须唯一，只能包含字母、数字和下划线</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="projectName">项目名称 *</label>
                        <input class="form-control" id="projectName" placeholder="请输入项目名称，如：我的应用" required
                               type="text">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">取消</button>
                <button class="btn btn-primary" onclick="addProject()" type="button">确定</button>
            </div>
        </div>
    </div>
</div>

<!-- 删除确认模态框 -->
<div class="modal fade" id="deleteProjectModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认删除</h5>
                <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <p>确定要删除项目 <strong id="deleteProjectName"></strong> 吗？</p>
                <p class="text-danger">此操作不可撤销！</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">取消</button>
                <button class="btn btn-danger" onclick="confirmDeleteProject()" type="button">确定删除</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentDeleteProjectCode = null;

    // 页面加载完成后执行
    document.addEventListener('DOMContentLoaded', function () {
        loadProjects();
    });

    // 加载项目列表
    async function loadProjects() {
        try {
            const response = await fetch('/api/config/projects');
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            const result = await response.json();

            if (result.code === 0) {
                displayProjects(result.data);
            } else {
                showError('加载项目列表失败: ' + result.msg);
            }
        } catch (error) {
            showError('加载项目列表失败: ' + error.message);
        }
    }

    // 显示项目列表
    function displayProjects(projects) {
        const container = document.getElementById('projectsList');

        if (projects.length === 0) {
            container.innerHTML = '<p class="text-muted">暂无项目</p>';
            return;
        }

        const html = projects.map(project => `
                <div class="project-item">
                    <div class="project-info">
                        <div class="d-flex align-items-center gap-2">
                            <h6 class="mb-1">${project.name}</h6>
                            <span class="default-badge">枚举</span>
                        </div>
                        <small class="text-muted">代码: ${project.code}</small>
                    </div>
                </div>
            `).join('');

        container.innerHTML = html;
    }

    // 显示新增项目模态框
    function showAddProjectModal() {
        document.getElementById('addProjectForm').reset();
        const modal = new bootstrap.Modal(document.getElementById('addProjectModal'));
        modal.show();
    }

    // 添加项目
    async function addProject() {
        const code = document.getElementById('projectCode').value.trim();
        const name = document.getElementById('projectName').value.trim();

        if (!code || !name) {
            showError('请填写完整的项目信息');
            return;
        }

        // 验证项目代码格式
        if (!/^[a-zA-Z0-9_]+$/.test(code)) {
            showError('项目代码只能包含字母、数字和下划线');
            return;
        }

        try {
            const response = await fetch('/api/config/projects', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({code, name})
            });

            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }

            const result = await response.json();

            if (result.code === 0) {
                showSuccess('项目添加成功');
                bootstrap.Modal.getInstance(document.getElementById('addProjectModal')).hide();
                loadProjects(); // 重新加载列表
            } else {
                showError('添加项目失败: ' + result.msg);
            }
        } catch (error) {
            showError('添加项目失败: ' + error.message);
        }
    }

    // 显示删除项目模态框
    function showDeleteProjectModal(code, name) {
        currentDeleteProjectCode = code;
        document.getElementById('deleteProjectName').textContent = name;
        const modal = new bootstrap.Modal(document.getElementById('deleteProjectModal'));
        modal.show();
    }

    // 确认删除项目
    async function confirmDeleteProject() {
        if (!currentDeleteProjectCode) {
            return;
        }

        try {
            const response = await fetch(`/api/config/projects/${currentDeleteProjectCode}`, {
                method: 'DELETE'
            });

            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }

            const result = await response.json();

            if (result.code === 0) {
                showSuccess('项目删除成功');
                bootstrap.Modal.getInstance(document.getElementById('deleteProjectModal')).hide();
                loadProjects(); // 重新加载列表
            } else {
                showError('删除项目失败: ' + result.msg);
            }
        } catch (error) {
            showError('删除项目失败: ' + error.message);
        }
    }

    // 显示成功消息
    function showSuccess(message) {
        // 这里可以使用 Bootstrap 的 toast 或 alert
        alert('成功: ' + message);
    }

    // 显示错误消息
    function showError(message) {
        // 这里可以使用 Bootstrap 的 toast 或 alert
        alert('错误: ' + message);
    }
</script>
</body>
</html>
