# Development profile overrides for the verified mock runtime.
mass:
  runtime:
    event-handler-timeout-ms: 5000
    transport-max-pending-tasks: 10000
    event-max-pending-tasks: 2000
  websocket:
    port: 18088
    max-connections: 1000
    enabled: true
  engine:
    worker-threads: 8
    enabled: true
  mock:
    data:
      workers: mock/mock_workers.json
      worker-contexts: mock/mock_worker_contexts.json
      tasks: mock/mock_tasks.json
      rules: mock/mock_rules.json

server:
  port: 8088

logging:
  level:
    com.xa.mass: DEBUG
    com.xa.mass.starter: INFO
    com.xa.mass.transport.websocket: INFO
    com.xa.mass.engine: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
