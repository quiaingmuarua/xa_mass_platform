# Production-like profile overrides for the verified mock runtime.
mass:
  websocket:
    port: 18088
    max-connections: 5000
    enabled: true
  engine:
    worker-threads: 16
    enabled: true
  mock:
    data:
      workers: mock/mock_workers.json
      worker-contexts: mock/mock_worker_contexts.json
      tasks: mock/mock_tasks.json
      rules: mock/mock_rules.json

server:
  port: 8088

logging:
  level:
    com.xa.mass: INFO
    com.xa.mass.starter: WARN
    com.xa.mass.transport.websocket: INFO
    com.xa.mass.engine: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
