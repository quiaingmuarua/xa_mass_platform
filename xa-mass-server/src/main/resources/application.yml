spring:
  application:
    name: mass_server
  threads:
    virtual:
      enabled: true
  redis:
    host: localhost
    port: 6379
    database: 0
  flyway:
    enabled: false
  profiles:
    default: dev

server:
  port: 8088

sample:
  client:
    auto-start: false
    uri: ws://localhost:${mass.websocket.port:18088}/ws
    count: 5
    task:
      interval: 30000

mass:
  control-plane:
    seed:
      enabled: false
      mode: apply
      catalog-location:
      rules-location:
      # Optional hash-only operator credential seed.
      # In prod + operator session auth, startup fails unless at least one
      # ACTIVE operator credential exists after this seed/import step.
      # Seed files must use passwordHash; plaintext password is rejected.
      operator-credentials-location:
  auth:
    operator:
      # Blank means profile default: dev -> dev-header, prod -> session.
      # Explicit values: dev-header, session, disabled.
      mode:
      allow-unsafe-dev-header-in-prod: false
      bootstrap:
        # Local escape hatch only. Keep false for normal prod startup:
        # prod session auth should fail closed when credentials are missing.
        allow-empty-before-seed: false
      session:
        ttl: 8h
        cookie-secure:
  runtime:
    mode: memory
    event-handler-timeout-ms: 5000
    transport-max-pending-tasks: 10000
    event-max-pending-tasks: 2000
    redis:
      namespace: xa:mass:runtime:v1
      max-queued-items: 1000000
  transport:
    node-id: ${random.uuid}
    delivery:
      store: memory
      max-queued-items: 100000
      max-items-per-route: 10000
      redis:
        namespace: xa:mass:transport:delivery:v1
    presence:
      store: memory
      lease-millis: 30000
      redis:
        namespace: xa:mass:transport:presence:v1
  websocket:
    port: 18088
  queue:
    input:
      stream-key: mass_server_input_stream
      group-name: mass_server_input_group
      consumer-name: mass_server_input_consumer_instance_1
    output:
      stream-key: mass_server_output_stream
      group-name: mass_server_output_group
      consumer-name: mass_server_output_consumer_instance_1

logging:
  level:
    root: INFO

knife4j:
  enable: true
