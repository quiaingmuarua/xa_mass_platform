spring:
  application:
    name: mass_server
  threads:
    virtual:
      enabled: true
  redis:
    host: localhost
    port: 6379
    database: 0
  flyway:
    enabled: false
  profiles:
    default: durable-local

server:
  port: 8088

sample:
  client:
    auto-start: false
    uri: ws://localhost:${mass.websocket.port:18088}/ws
    count: 5
    task:
      interval: 30000

mass:
  control-plane:
    seed:
      enabled: false
      mode: apply
      # Explicit local/sample fixture escape hatch. Keep false unless importing
      # a seed file that is intentionally marked local fixture and contains
      # devOnly API-key raw secrets.
      allow-local-fixture-raw-secrets: false
      catalog-location:
      rules-location:
      # Optional hash-only operator credential seed.
      # In durable-local + operator session auth, startup fails unless at least one
      # ACTIVE operator credential exists after this seed/import step.
      # Seed files must use passwordHash; plaintext password is rejected.
      operator-credentials-location:
  local-schema-reset:
    # Local destructive environment management only. When enabled, durable-local
    # SQLite startup records a sidecar schema fingerprint before migrations.
    # A mismatch fails fast unless reset-on-mismatch is explicitly enabled.
    enabled: true
    reset-on-mismatch: false
  auth:
    operator:
      # New server profiles must set this explicitly. Blank remains only for
      # isolated test construction and is not a profile contract.
      # Explicit values: dev-header, session, disabled.
      mode:
      allow-local-fixture-header: false
      bootstrap:
        # Local escape hatch only. Keep false for normal durable-local startup:
        # session auth should fail closed when credentials are missing.
        allow-empty-before-seed: false
      session:
        ttl: 8h
        cookie-secure:
  runtime:
    mode: memory
    event-handler-timeout-ms: 5000
    transport-max-pending-tasks: 10000
    event-max-pending-tasks: 2000
    redis:
      namespace: xa:mass:runtime:v1
      max-queued-items: 1000000
  transport:
    node-id: ${random.uuid}
    delivery:
      store: memory
      max-queued-items: 100000
      max-items-per-route: 10000
      redis:
        namespace: xa:mass:transport:delivery:v1
    endpoint-lease:
      store: memory
      lease-millis: 30000
      redis:
        namespace: xa:mass:transport:endpoint-lease:v1
  websocket:
    port: 18088
  queue:
    input:
      stream-key: mass_server_input_stream
      group-name: mass_server_input_group
      consumer-name: mass_server_input_consumer_instance_1
    output:
      stream-key: mass_server_output_stream
      group-name: mass_server_output_group
      consumer-name: mass_server_output_consumer_instance_1

logging:
  level:
    root: INFO

knife4j:
  enable: true
