# PostgreSQL persistence profile for control-plane storage verification.
#
# Use with the runnable server profile, for example:
#   -Dspring.profiles.active=dev,postgres
#
# Override the JDBC URL/credentials for your local instance.
mass:
  storage:
    mode: jdbc-postgres
    jdbc:
      url: jdbc:postgresql://127.0.0.1:5432/xa_mass
      username: postgres
      password: postgres
