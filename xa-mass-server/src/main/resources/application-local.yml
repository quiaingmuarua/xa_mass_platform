# Local developer profile. Active by default (see application.yml spring.profiles.active=local).
# Inherits all base application.yml settings; add local overrides here.
# For dev/CI differences use application-dev.yml instead.
mass:
  websocket:
    port: 18088
    max-connections: 200
    enabled: true
  engine:
    worker-threads: 4
    enabled: true
  sample:
    data:
      workers: mock/mock_workers.json
      worker-contexts: mock/mock_worker_contexts.json
      tasks: mock/mock_tasks.json
      rules: mock/mock_rules.json

logging:
  level:
    com.xa.mass: DEBUG
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
