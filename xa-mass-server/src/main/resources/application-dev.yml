# Development profile overrides for the verified server shell.
mass:
  demo:
    bootstrap:
      enabled: true
      worker-count: 36
      task-count: 12
      items-per-task: 1500
      batch-size: 20
      default-max-retry-count: 1
      auto-approve-tasks: true
      routing-lanes: us,gb,de,fr,sg,jp
  runtime:
    event-handler-timeout-ms: 5000
    transport-max-pending-tasks: 10000
    event-max-pending-tasks: 2000
  websocket:
    port: 18088
    max-connections: 1000
    enabled: true
  engine:
    worker-threads: 8
    enabled: true
server:
  port: 8088

logging:
  level:
    com.xa.mass: DEBUG
    com.xa.mass.starter: INFO
    com.xa.mass.transport.websocket: INFO
    com.xa.mass.engine: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

sample:
  client:
    auto-start: true
    websocket-uri: ws://localhost:${mass.websocket.port}/ws
  bootstrap:
    api-key: dev-bootstrap-key
  worker:
    auto-start: false
