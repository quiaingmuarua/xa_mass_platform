# Development profile overrides for the verified server shell.
mass:
  storage:
    mode: jdbc-h2
    jdbc:
      url: jdbc:h2:file:./data/xa-mass-h2/xa_mass;MODE=PostgreSQL;DATABASE_TO_UPPER=false
      username: sa
      password:
  control-console:
    scenario:
      enabled: false
  runtime:
    mode: memory
    event-handler-timeout-ms: 5000
    transport-max-pending-tasks: 10000
    event-max-pending-tasks: 2000
  transport:
    node-id: local-dev-server
    delivery:
      store: memory
    presence:
      store: memory
  websocket:
    port: 18088
    max-connections: 1000
    enabled: true
  engine:
    worker-threads: 8
    enabled: true
server:
  port: 8088

logging:
  level:
    com.xa.mass: DEBUG
    com.xa.mass.starter: INFO
    com.xa.mass.transport.websocket: INFO
    com.xa.mass.engine: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

sample:
  client:
    auto-start: true
    websocket-uri: ws://localhost:${mass.websocket.port}/ws
  worker:
    auto-start: false
