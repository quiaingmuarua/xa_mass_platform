# Durable-local profile overrides for the verified server shell.
mass:
  storage:
    mode: jdbc-sqlite
    jdbc:
      url: jdbc:sqlite:./data/xa-mass-sqlite/xa_mass.db
      username:
      password:
  local-schema-reset:
    # Pre-release local SQLite guard. Existing DBs without the sidecar
    # xa_mass.db.schema.sha256, or with a mismatched hash, are reset by
    # default only for this allowlisted local file-backed SQLite profile.
    # Disable when intentionally inspecting a stale local DB:
    # --mass.local-schema-reset.reset-on-mismatch=false
    enabled: true
    reset-on-mismatch: true
  control-plane:
    seed:
      # Durable-local startup order is seed/import -> operator readiness -> runtime start.
      # Leave disabled only when xa_operator_credential already has an ACTIVE
      # login-capable operator credential. Otherwise session auth fails
      # before runtime starts.
      enabled: true
      mode: apply
      allow-local-fixture-raw-secrets: false
      # Fresh durable-local environment:
      # mass.control-plane.seed.enabled=true
      # operator-credentials-location: classpath:control-plane-seed/operator-credentials.json
      # Set catalog/rules only to explicit local seed files. The
      # checked-in sample scenario seed contains devOnly API-key raw secrets and
      # is rejected unless the import is explicitly marked local fixture.
      catalog-location:
      rules-location:
      # Seed file shape:
      # {
      #   "operatorCredentials": [
      #     {
      #       "userId": "ops-admin",
      #       "passwordHash": "{bcrypt}...",
      #       "status": "ACTIVE"
      #     }
      #   ]
      # }
      # Plaintext password is rejected by design.
      operator-credentials-location: classpath:control-plane-seed/operator-credentials.json
  auth:
    operator:
      # Durable-local default is explicit session auth.
      # dev-header is allowed only by explicit local fixture override.
      mode: session
      allow-local-fixture-header: false
  runtime:
    mode: redis
    event-handler-timeout-ms: 5000
    transport-max-pending-tasks: 20000
    event-max-pending-tasks: 5000
  transport:
    node-id: durable-local-server
    polling:
      buffer:
        store: redis
    endpoint-lease:
      store: redis
  websocket:
    port: 18088
    max-connections: 5000
    enabled: true
  engine:
    worker-threads: 16
    enabled: true

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.xa.mass: INFO
    com.xa.mass.starter: WARN
    com.xa.mass.transport.websocket: INFO
    com.xa.mass.engine: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
