# Legacy H2 persistence overlay retained for compose until compose startup is
# converged separately.
#
# Normal local server startup uses application-dev.yml directly.
#
# Tests should keep using isolated in-memory H2 URLs through DynamicPropertySource.
mass:
  storage:
    mode: jdbc-h2
    jdbc:
      url: jdbc:h2:file:./data/xa-mass-h2/xa_mass;MODE=PostgreSQL;DATABASE_TO_UPPER=false
      username: sa
      password:
