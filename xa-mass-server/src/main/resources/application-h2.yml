# H2 persistence profile for local/server storage verification.
#
# Use with the runnable server profile, for example:
#   -Dspring.profiles.active=dev,h2
#
# Tests should keep using isolated in-memory H2 URLs through DynamicPropertySource.
mass:
  storage:
    mode: jdbc-h2
    jdbc:
      url: jdbc:h2:file:./data/xa-mass-h2/xa_mass;MODE=PostgreSQL;DATABASE_TO_UPPER=false
      username: sa
      password:
