# Legacy Redis-backed runtime overlay retained for compose until compose startup
# is converged separately.
#
# Normal prod startup uses application-prod.yml directly.
#
# This keeps task work/result runtime, worker registry runtime, transport
# delivery queues, and transport presence evidence in Redis. It is not a
# replacement for durable control-plane storage; combine with h2/postgres if
# task shells must survive server restart.
mass:
  runtime:
    mode: redis
  transport:
    node-id: local-server
    delivery:
      store: redis
    presence:
      store: redis
