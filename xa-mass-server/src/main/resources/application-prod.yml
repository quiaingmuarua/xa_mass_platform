# Production-like profile overrides for the verified server shell.
mass:
  storage:
    mode: jdbc-sqlite
    jdbc:
      url: jdbc:sqlite:./data/xa-mass-sqlite/xa_mass.db
      username:
      password:
  control-plane:
    seed:
      # Prod startup order is seed/import -> operator readiness -> runtime start.
      # Leave disabled only when xa_operator_credential already has an ACTIVE
      # login-capable operator credential. Otherwise prod session auth fails
      # before runtime starts.
      enabled: false
      mode: apply
      # Fresh local prod-like environment:
      # mass.control-plane.seed.enabled=true
      # operator-credentials-location: classpath:control-plane-seed/operator-credentials.json
      # Set catalog/rules only to environment-owned external seed files. The
      # checked-in sample scenario seed contains devOnly API-key raw secrets and
      # is rejected by prod seed import.
      catalog-location:
      rules-location:
      # Seed file shape:
      # {
      #   "operatorCredentials": [
      #     {
      #       "userId": "ops-admin",
      #       "passwordHash": "{bcrypt}...",
      #       "status": "ACTIVE"
      #     }
      #   ]
      # }
      # Plaintext password is rejected by design.
      operator-credentials-location: classpath:control-plane-seed/operator-credentials.json
  auth:
    operator:
      # Prod default is session when blank. This is the normal prod trust path.
      # Set disabled only for local infra-only validation; do not treat it as
      # production auth.
      mode:
      allow-unsafe-dev-header-in-prod: false
  runtime:
    mode: redis
    event-handler-timeout-ms: 5000
    transport-max-pending-tasks: 20000
    event-max-pending-tasks: 5000
  transport:
    node-id: local-prod-server
    delivery:
      store: redis
    presence:
      store: redis
  websocket:
    port: 18088
    max-connections: 5000
    enabled: true
  engine:
    worker-threads: 16
    enabled: true

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.xa.mass: INFO
    com.xa.mass.starter: WARN
    com.xa.mass.transport.websocket: INFO
    com.xa.mass.engine: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
