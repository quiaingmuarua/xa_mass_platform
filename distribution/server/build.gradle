import groovy.json.JsonOutput

plugins {
    id 'base'
}

apply from: rootProject.file('gradle/platform-diagnostic-codes.gradle')

def runtimeVersion = project.version.toString()
def requestedVersion = providers.gradleProperty('xaMassVersion')
def repositoryRoot = rootProject.projectDir
def pythonExecutable = providers.environmentVariable('XA_MASS_PYTHON_EXECUTABLE')
        .orElse('python')
def isWindows = System.getProperty('os.name')
        .toLowerCase(Locale.ROOT)
        .contains('windows')
def frontendDirectory = rootProject.file('frontend')
def stagedDirectory = layout.buildDirectory.dir("runtime/${runtimeVersion}")
def generatedDirectory = layout.buildDirectory.dir('generated/runtime')
def runtimeBaseName = 'xa-mass-server-runtime'
def runtimeRootName = "${runtimeBaseName}-${runtimeVersion}"
def serverBootJar = project(':server_jvm').tasks.named('bootJar')
def gitCommit = providers.exec {
    workingDir repositoryRoot
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.map { it.trim() }

def pnpmCommand = { List<String> arguments ->
    if (isWindows) {
        return ['cmd.exe', '/d', '/c', 'corepack', 'pnpm@11.9.0'] + arguments
    }
    return ['corepack', 'pnpm@11.9.0'] + arguments
}

tasks.register('validateRuntimeVersion') {
    group = 'verification'
    description = 'Requires one explicit SemVer shared by the JAR and archive.'
    doLast {
        if (!requestedVersion.isPresent()) {
            throw new GradleException(
                    'Runtime distribution requires -PxaMassVersion=<major.minor.patch>'
            )
        }
        if (!(runtimeVersion ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
            throw new GradleException(
                    "Runtime distribution version must be release SemVer: ${runtimeVersion}"
            )
        }
    }
}

tasks.register('installFrontend', Exec) {
    group = 'distribution'
    description = 'Installs the pinned frontend dependency graph.'
    workingDir frontendDirectory
    inputs.files(
            rootProject.file('frontend/package.json'),
            rootProject.file('frontend/pnpm-lock.yaml'),
            rootProject.file('frontend/pnpm-workspace.yaml')
    )
    outputs.file(rootProject.file('frontend/node_modules/.xa-mass-runtime-install.marker'))
    doFirst {
        commandLine(pnpmCommand(['install', '--frozen-lockfile']))
    }
    doLast {
        rootProject.file('frontend/node_modules/.xa-mass-runtime-install.marker')
                .setText('pnpm 11.9.0\n', 'UTF-8')
    }
}

tasks.register('buildFrontend', Exec) {
    group = 'distribution'
    description = 'Builds the pinned Runtime Viewer frontend.'
    dependsOn tasks.named('installFrontend')
    workingDir frontendDirectory
    inputs.files(fileTree(frontendDirectory) {
        include 'src/**', 'public/**', 'index.html', '*.json', '*.ts', '*.js'
        exclude 'node_modules/**', 'dist/**', 'coverage/**'
    })
    outputs.dir(rootProject.file('frontend/dist'))
    doFirst {
        commandLine(pnpmCommand(['build']))
    }
}

tasks.register('generateRuntimeManifest') {
    group = 'distribution'
    description = 'Generates the checked runtime archive manifest.'
    dependsOn serverBootJar
    inputs.property('runtimeVersion', runtimeVersion)
    inputs.property('gitCommit', gitCommit)
    inputs.file(serverBootJar.flatMap { it.archiveFile })
    outputs.file(generatedDirectory.map { it.file('manifest.json') })
    doLast {
        String resolvedGitCommit = gitCommit.get()
        if (!(resolvedGitCommit ==~ /[0-9a-f]{40}/)) {
            throw new GradleException('git rev-parse HEAD did not return a full commit')
        }
        File output = generatedDirectory.get().file('manifest.json').asFile
        output.parentFile.mkdirs()
        output.setText(
                JsonOutput.prettyPrint(JsonOutput.toJson([
                        schemaVersion   : 5,
                        version         : runtimeVersion,
                        gitCommit       : resolvedGitCommit,
                        serverJar       : "lib/xa-mass-server-jvm-${runtimeVersion}.jar",
                        javaVersion     : 21,
                        defaultSpringProfile: 'scenario-workers',
                        springProfiles  : [
                                'scenario-workers',
                                'agentforge'
                        ],
                        frontendIncluded: true
                ])) + System.lineSeparator(),
                'UTF-8'
        )
    }
}

tasks.register('stageRuntime', Sync) {
    group = 'distribution'
    description = 'Stages the complete unpacked XA Mass Server Runtime.'
    dependsOn(
            tasks.named('validateRuntimeVersion'),
            serverBootJar,
            tasks.named('buildFrontend'),
            tasks.named('generateRuntimeManifest'),
            tasks.named('generatePlatformDiagnosticCodes')
    )
    into stagedDirectory
    from(serverBootJar.flatMap { it.archiveFile }) {
        into 'lib'
    }
    from(rootProject.file('frontend/dist')) {
        into 'frontend/dist'
        exclude 'reference/platform-diagnostic-codes.json'
    }
    from(platformDiagnosticCodesFile) {
        into 'frontend/dist/reference'
    }
    from('src/main/dist') {
        exclude '**/__pycache__/**', '**/*.pyc'
    }
    from(rootProject.file('frontend/LICENSE.pure-admin-thin'))
    from(rootProject.file('frontend/THIRD_PARTY_NOTICES.md')) {
        rename { 'THIRD_PARTY_NOTICES.frontend.md' }
    }
    from(generatedDirectory.map { it.file('manifest.json') })
}

tasks.register('distZip', Zip) {
    group = 'distribution'
    description = 'Builds the single publishable XA Mass Server Runtime ZIP.'
    dependsOn tasks.named('stageRuntime')
    archiveBaseName.set(runtimeBaseName)
    archiveVersion.set(runtimeVersion)
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    into(runtimeRootName) {
        from(stagedDirectory)
    }
}

tasks.register('sourceLauncherTest', Exec) {
    group = 'verification'
    description = 'Runs standard-library tests for Runtime source and proof helpers.'
    workingDir repositoryRoot
    inputs.files(
            rootProject.file('run_local_runtime.py'),
            rootProject.file('.github/scripts/run_runtime_distribution_proof.py'),
            rootProject.file('.github/scripts/test_run_local_runtime.py'),
            rootProject.file(
                    '.github/scripts/test_run_runtime_distribution_proof.py'
            )
    )
    commandLine(
            pythonExecutable.get(),
            '-m',
            'unittest',
            'discover',
            '-s',
            rootProject.file('.github/scripts').absolutePath,
            '-p',
            'test_run_*runtime*.py',
            '-v'
    )
}

tasks.register('verifyRuntimeArchive', Exec) {
    group = 'verification'
    description = 'Verifies the Java-only publishable Runtime ZIP ABI.'
    dependsOn tasks.named('distZip')
    workingDir repositoryRoot
    inputs.file(tasks.named('distZip', Zip).flatMap { it.archiveFile })
    inputs.file('src/test/python/verify_runtime_archive.py')
    commandLine(
            pythonExecutable.get(),
            file('src/test/python/verify_runtime_archive.py').absolutePath,
            '--archive',
            tasks.named('distZip', Zip).flatMap { it.archiveFile }.get().asFile.absolutePath,
            '--version', runtimeVersion
    )
}

tasks.register('runtimeDistributionTest', Exec) {
    group = 'verification'
    description = 'Unpacks and proves the published Runtime against real Redis.'
    dependsOn tasks.named('sourceLauncherTest'), tasks.named('verifyRuntimeArchive')
    workingDir repositoryRoot
    inputs.file(tasks.named('distZip', Zip).flatMap { it.archiveFile })
    inputs.file(rootProject.file('.github/scripts/run_runtime_distribution_proof.py'))
    outputs.upToDateWhen { false }
    commandLine(
            pythonExecutable.get(),
            rootProject.file('.github/scripts/run_runtime_distribution_proof.py').absolutePath,
            '--archive',
            tasks.named('distZip', Zip).flatMap { it.archiveFile }.get().asFile.absolutePath,
            '--redis-url',
            providers.environmentVariable('XA_MASS_REDIS_URL')
                    .orElse('redis://127.0.0.1:6379/15')
                    .get()
    )
}

tasks.named('check') {
    dependsOn tasks.named('sourceLauncherTest'), tasks.named('verifyRuntimeArchive')
}

tasks.named('assemble') {
    dependsOn tasks.named('distZip')
}
