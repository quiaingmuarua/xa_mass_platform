plugins {
    id 'java'
}

base {
    archivesName.set('xa-mass-worker-fleet-acceptance')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':transport:worker-delivery-contract')

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('runFleetAcceptance', JavaExec) {
    description = 'Runs the external Scenario Worker Fleet acceptance proof.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.xa.mass.integration.workerfleet.WorkerFleetAcceptanceMain'
    workingDir = project.projectDir
}

tasks.named('test') {
    useJUnitPlatform()
    workingDir = project.projectDir
}
