plugins {
    id 'java'
}

base {
    archivesName.set('xa-mass-worker-capability-task-integration')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':transport:worker-delivery-contract')

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.googlecode.libphonenumber:libphonenumber:9.0.31'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('runCapabilityTaskScenario', JavaExec) {
    description = 'Runs the finite Worker capability Task proof.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.xa.mass.integration.workercapability.WorkerCapabilityTaskMain'
    workingDir = project.projectDir
}

tasks.named('test') {
    useJUnitPlatform()
    workingDir = project.projectDir
}
