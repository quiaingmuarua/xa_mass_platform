plugins {
    id 'java'
}

base {
    archivesName.set('xa-mass-android-worker-proof')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':transport:worker-delivery-contract')

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('runAndroidWorkerCorrectness', JavaExec) {
    description = 'Runs one phase of the Android Worker correctness proof.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.xa.mass.integration.androidworkerproof.AndroidWorkerCorrectnessMain'
    workingDir = project.projectDir
}

tasks.register('runAndroidWorkerConvergenceHealth', JavaExec) {
    description = 'Runs one phase of the Android Worker convergence proof.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.xa.mass.integration.androidworkerproof.AndroidWorkerConvergenceHealthMain'
    workingDir = project.projectDir
}

tasks.register('runAndroidWorkerTriadCorrectness', JavaExec) {
    description = 'Runs the fixed three-application Android correctness proof.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.xa.mass.integration.androidworkerproof.AndroidWorkerTriadCorrectnessMain'
    workingDir = project.projectDir
}

tasks.register('runAndroidWorkerTriadConvergenceHealth', JavaExec) {
    description = 'Runs one phase of the fixed Android triad convergence proof.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.xa.mass.integration.androidworkerproof.AndroidWorkerTriadConvergenceHealthMain'
    workingDir = project.projectDir
}

tasks.named('test') {
    useJUnitPlatform()
    workingDir = project.projectDir
}
