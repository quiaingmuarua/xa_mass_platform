plugins {
    id 'java'
}

base {
    archivesName.set('xa-mass-phone-number-rpc-integration')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':worker_delivery_contract_jvm')

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.googlecode.libphonenumber:libphonenumber:9.0.31'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('runTaskScenario', JavaExec) {
    description = 'Runs the phone-number TaskItem RPC scenario.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.xa.mass.integration.phonenumber.PhoneNumberTaskMain'
    workingDir = project.projectDir
}

tasks.named('test') {
    useJUnitPlatform()
    workingDir = project.projectDir
}
