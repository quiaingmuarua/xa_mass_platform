plugins {
    id 'java'
}

base {
    archivesName.set('xa-mass-worker-correctness')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':transport:worker-delivery-contract')

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('runWorkerCorrectness', JavaExec) {
    description = 'Runs one phase of the external Worker correctness proof.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.xa.mass.integration.workercorrectness.WorkerCorrectnessMain'
    workingDir = project.projectDir
}

tasks.named('test') {
    useJUnitPlatform()
    workingDir = project.projectDir
}
