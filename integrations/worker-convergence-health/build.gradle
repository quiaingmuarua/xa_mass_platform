plugins {
    id 'java'
}

base {
    archivesName.set('xa-mass-worker-convergence-health')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':transport:worker-delivery-contract')

    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('runWorkerStateAndServerConvergence', JavaExec) {
    description = 'Runs one phase of Worker state and Server convergence proof.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.xa.mass.integration.workerlab.WorkerStateConvergenceMain'
    workingDir = project.projectDir
}

tasks.register('runWorkerTaskFaultConvergence', JavaExec) {
    description = 'Runs one phase of Worker task-fault convergence proof.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.xa.mass.integration.workerlab.WorkerTaskFaultConvergenceMain'
    workingDir = project.projectDir
}

tasks.named('test') {
    useJUnitPlatform()
    workingDir = project.projectDir
}
