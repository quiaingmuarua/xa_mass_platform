plugins {
    id 'java-library'
}

base {
    archivesName.set('xa-mass-worker-delivery-adapter-jvm')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation platform('tools.jackson:jackson-bom:3.1.4')
    implementation platform('io.netty:netty-bom:4.2.15.Final')
    implementation 'tools.jackson.core:jackson-databind'
    api project(':worker_delivery_contract_jvm')
    implementation 'io.netty:netty-transport'
    implementation 'io.netty:netty-handler'
    implementation 'io.netty:netty-codec'
    implementation 'io.netty:netty-codec-http'

    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
