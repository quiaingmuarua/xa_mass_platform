plugins {
    id 'com.android.application' version '8.9.3' apply false
    id 'com.android.library' version '8.9.3' apply false
    id 'org.springframework.boot' version '4.1.0' apply false
}

allprojects {
    group = 'com.xa.mass'
    version = providers.gradleProperty('xaMassVersion')
            .orElse('4.3.2-SNAPSHOT')
            .get()
    tasks.withType(Test).configureEach {
        def robolectricRepoUrl = System.getenv('ROBOLECTRIC_DEPENDENCY_REPO_URL')
        if (robolectricRepoUrl) {
            systemProperty 'robolectric.dependency.repo.url', robolectricRepoUrl
            systemProperty 'robolectric.dependency.repo.id',
                    System.getenv('ROBOLECTRIC_DEPENDENCY_REPO_ID') ?: 'custom-mirror'
        }
    }
}
