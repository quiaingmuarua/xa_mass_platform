plugins {
    id 'application'
}

base {
    archivesName.set('xa-mass-worker-jvm')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.xa.mass.worker.WorkerMain'
}

dependencies {
    implementation project(':worker_delivery_contract_jvm')
    implementation platform('tools.jackson:jackson-bom:3.1.4')
    implementation 'tools.jackson.core:jackson-databind'
    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.32'

    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
