name: xa-mass-platform

services:
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace
    command: >
      sh -lc 'set -- /workspace/xa-mass-server/target/xa-mass-server-*.jar;
              [ -f "$1" ] || {
                echo "Build the server jar first: ./mvnw -pl xa-mass-server -am -DskipTests package";
                exit 64;
              };
              exec java -jar "$1"'
    depends_on:
      redis:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dspring.profiles.active=prod
        -Dserver.port=8088
        -Dmass.websocket.port=18088
        -Dmass.socket.port=18089
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_DATABASE: "0"
      MASS_STORAGE_JDBC_URL: jdbc:sqlite:/workspace-runtime/sqlite/xa_mass.db
      MASS_TRANSPORT_NODE_ID: compose-server-1
      MASS_RUNTIME_REDIS_NAMESPACE: xa:mass:compose:runtime:v1
      MASS_TRANSPORT_DELIVERY_REDIS_NAMESPACE: xa:mass:compose:transport:delivery:v1
      MASS_TRANSPORT_PRESENCE_REDIS_NAMESPACE: xa:mass:compose:transport:presence:v1
    ports:
      - "8088:8088"
      - "18088:18088"
      - "18089:18089"
    volumes:
      - .:/workspace
      - sqlite-data:/workspace-runtime/sqlite

volumes:
  redis-data:
  sqlite-data:
