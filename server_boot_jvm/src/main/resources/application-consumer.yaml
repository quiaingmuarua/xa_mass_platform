server:
  port: ${SERVER_PORT:18182}

xa:
  mass:
    task-retention:
      enabled: ${XA_MASS_TASK_RETENTION_ENABLED:${xa.mass.kernel-pacer.enabled}}
      grace: 1h
      retention: 7d
      interval: 1h
      directory: ${XA_MASS_TASK_ARCHIVE_DIRECTORY:./data/task-archives}
    project-assembly:
      projects: []
    kernel-pacer:
      preset: ${XA_MASS_KERNEL_PACER_PRESET:DEFAULT}
    redis:
      scope: ${XA_MASS_REDIS_SCOPE:profile_consumer}
    worker-delivery:
      adapter:
        instances:
          runtime-websocket:
            type: WEBSOCKET
            listen-host: 127.0.0.1
            listen-port: ${XA_MASS_ADAPTER_PORT:18183}
            command-backoff-min: 10ms
            command-backoff-step: 10ms
            command-backoff-max: 100ms
            command-consume-limit: 500
            command-retry-capacity: 1000
            report-backoff: 1s
            report-queue-capacity: 1000
            reconnect-verification-retention: 10m
            maximum-disconnected-workers: 100000
            maximum-encoded-properties-bytes: 67108864
            send-time-limit: 5s
            shutdown-timeout: 5s
    worker-endpoints:
      defaults:
        WEBSOCKET: runtime-websocket
      endpoints:
        runtime-websocket:
          transport-type: WEBSOCKET
          public-uri: ws://127.0.0.1:${XA_MASS_ADAPTER_PORT:18183}/api/v1/worker-delivery/websocket
    worker-assembly:
      group-config-json: '{}'
