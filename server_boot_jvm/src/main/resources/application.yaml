server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 18082
  tomcat:
    threads:
      max: 200
      min-spare: 10

spring:
  threads:
    virtual:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  web:
    resources:
      static-locations: file:../frontend/dist/

xa:
  mass:
    task-retention:
      enabled: ${XA_MASS_TASK_RETENTION_ENABLED:${xa.mass.kernel-pacer.enabled}}
      grace: 1h
      retention: 7d
      history-retention: 30d
      interval: 1h
      database-path: ${XA_MASS_TASK_HISTORY_DATABASE:./data/task-history.sqlite}
      rpc-item-retention-enabled: false
      rpc-input-retention: 1h
      rpc-terminal-retention: 24h
    project-assembly:
      projects: []
    kernel-pacer:
      enabled: ${XA_MASS_KERNEL_PACER_ENABLED:true}
      preset: ${XA_MASS_KERNEL_PACER_PRESET:DEFAULT}
      shutdown-timeout: 5s
      assignment-batch-limit: ${XA_MASS_KERNEL_PACER_ASSIGNMENT_BATCH_LIMIT:100}
    redis:
      url: ${XA_MASS_REDIS_URL:redis://localhost:6379/15}
      scope: ${XA_MASS_REDIS_SCOPE:profile_default}
    worker-endpoints:
      defaults:
        POLLING: system-polling
      endpoints:
        system-polling:
          transport-type: POLLING
          public-uri: http://127.0.0.1:${server.port:18082}
    task-item-outcomes:
      names:
        6: succeeded
    task-rpc:
      result-idle-ttl: 7d
      default-wait-timeout-millis: 30000
      max-wait-timeout-millis: 60000
      max-waiters: 10000
      max-pending-observations: 100000
      max-probe-items-per-round: 256
      initial-probe-interval-millis: 50
      normal-probe-interval-millis: 100
      long-probe-interval-millis: 250
    direct-call:
      default-wait-timeout-millis: 3000
      max-wait-timeout-millis: 10000
      max-adapter-commands-per-adapter: 1000
      max-pending-calls: 10000
    worker-delivery:
      adapter:
        remote-base-url: http://127.0.0.1:${server.port:18082}
        remote-request-timeout: 5s
        verification-queue-capacity: 100000
        verification-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,kernel,kernelRedis
  metrics:
    tags:
      application: xa-mass-server
    distribution:
      percentiles-histogram:
        http.server.requests: true
        xa.mass.rpc.wait: true
        xa.mass.direct_call.batch: true
        xa.mass.pacer.dispatch.rounds: true
        xa.mass.pacer.result.batches: true
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s
        xa.mass.rpc.wait: 10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s,60s
        xa.mass.direct_call.batch: 10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
        xa.mass.pacer.dispatch.rounds: 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s
        xa.mass.pacer.result.batches: 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s

springdoc:
  paths-to-match: /api/v1/**

scalar:
  enabled: true
  path: /scalar
  url: /v3/api-docs
  page-title: XA Mass Runtime API
  with-default-fonts: false
  telemetry: false
  agent:
    disabled: true
