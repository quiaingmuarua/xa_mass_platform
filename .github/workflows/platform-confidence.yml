name: Platform Confidence Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: platform-confidence-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaged-process-confidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: ["memory-local", "durable-local"]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run packaged-process confidence smoke
        env:
          MASS_OPERATOR_PASSWORD: ops-admin
          MASS_CONFIDENCE_RESULT_TIMEOUT_SECONDS: "60"
        run: bash xa-mass-testing/scripts/run-platform-confidence-smoke.sh --profile "${{ matrix.profile }}"

      - name: Upload platform confidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-confidence-${{ matrix.profile }}
          path: xa-mass-testing/target/platform-confidence/**
          if-no-files-found: warn
