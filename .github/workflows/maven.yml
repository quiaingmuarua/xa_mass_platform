name: Maven CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: maven-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reactor-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Build and run core reactor tests
        run: ./mvnw -B -pl xa-mass-worker-pack -am test
      - name: Compile xa-mass-testing (compilation gate)
        run: ./mvnw -q -pl xa-mass-testing -am -DskipTests compile
      - name: Check xa-mass-sdk public API compatibility
        if: ${{ vars.XA_MASS_SDK_API_BASELINE_VERSION != '' }}
        run: >-
          ./mvnw -q -pl xa-mass-sdk -am
          -DskipTests
          -Dmass.sdk.api.baselineVersion=${{ vars.XA_MASS_SDK_API_BASELINE_VERSION }}
          verify
      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-reactor-core-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            logs/**
          if-no-files-found: warn

  scheduling-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Reset engine surefire reports before scheduling core suite
        run: rm -rf xa-mass-engine/target/surefire-reports
      - name: Run engine scheduling core suite
        run: >-
          ./mvnw -q -pl xa-mass-engine -am
          -Dtest=EngineSchedulingCoreSuite
          -Dsurefire.failIfNoSpecifiedTests=false
          test
      - name: Verify scheduling-core suite executed real testcases
        run: .github/scripts/assert-surefire-executed-tests.sh xa-mass-engine/target/surefire-reports
      - name: Preserve scheduling-core suite reports
        run: |
          rm -rf xa-mass-engine/target/surefire-reports-scheduling-core
          cp -R xa-mass-engine/target/surefire-reports xa-mass-engine/target/surefire-reports-scheduling-core
      - name: Reset engine surefire reports before kernel convergence suite
        run: rm -rf xa-mass-engine/target/surefire-reports
      - name: Run engine kernel convergence suite
        run: >-
          ./mvnw -q -pl xa-mass-engine -am
          -Dtest=EngineKernelConvergenceSuite
          -Dsurefire.failIfNoSpecifiedTests=false
          test
      - name: Verify kernel-convergence suite executed real testcases
        run: .github/scripts/assert-surefire-executed-tests.sh xa-mass-engine/target/surefire-reports
      - name: Preserve kernel-convergence suite reports
        run: |
          rm -rf xa-mass-engine/target/surefire-reports-kernel-convergence
          cp -R xa-mass-engine/target/surefire-reports xa-mass-engine/target/surefire-reports-kernel-convergence
      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-scheduling-core-reports
          path: |
            **/target/surefire-reports*/**
            **/target/failsafe-reports/**
            logs/**
          if-no-files-found: warn

  server-scheduling-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build server module dependencies
        run: ./mvnw -q -pl xa-mass-server -am -DskipTests install
      - name: Run representative scheduling E2E gate
        run: >-
          ./mvnw -q -pl xa-mass-server
          -Dtest=ServerSchedulingE2eSuite
          -Dsurefire.failIfNoSpecifiedTests=false
          test
      - name: Verify server scheduling suite executed real testcases
        run: .github/scripts/assert-surefire-executed-tests.sh xa-mass-server/target/surefire-reports
      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-server-scheduling-e2e-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            logs/**
          if-no-files-found: warn

  lifecycle-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Build server module dependencies
        run: ./mvnw -q -pl xa-mass-server -am -DskipTests install
      - name: Run non-scheduling lifecycle and result convergence checks
        run: >-
          ./mvnw -q -pl xa-mass-server
          -Dtest=ServerLifecycleResultConvergenceSuite
          -Dsurefire.failIfNoSpecifiedTests=false
          test
      - name: Verify lifecycle suite executed real testcases
        run: .github/scripts/assert-surefire-executed-tests.sh xa-mass-server/target/surefire-reports
      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-lifecycle-integration-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            logs/**
          if-no-files-found: warn

  chaos-smokes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Run chaos smoke probes
        env:
          CHAOS_TIMEOUT_SECONDS: "30"
          CHAOS_PROCESSING_DELAY: "10"
        run: xa-mass-testing/scripts/run-chaos-smokes.sh
      - name: Upload chaos reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-smoke-reports
          path: |
            **/target/chaos-reports/**
          if-no-files-found: warn
