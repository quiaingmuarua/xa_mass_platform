name: Maven CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: maven-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reactor-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Build and run core reactor tests
        run: ./mvnw -B -pl xa-mass-worker-pack -am test
      - name: Compile xa-mass-testing (compilation gate)
        run: ./mvnw -q -pl xa-mass-testing -DskipTests compile
      - name: Check xa-mass-sdk public API compatibility
        if: ${{ vars.XA_MASS_SDK_API_BASELINE_VERSION != '' }}
        run: >-
          ./mvnw -q -pl xa-mass-sdk -am
          -DskipTests
          -Dmass.sdk.api.baselineVersion=${{ vars.XA_MASS_SDK_API_BASELINE_VERSION }}
          verify
      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-reactor-core-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            logs/**
          if-no-files-found: warn

  server-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build server module dependencies
        run: ./mvnw -B -pl xa-mass-server -am -DskipTests install
      - name: Run full server test suite
        run: ./mvnw -B -pl xa-mass-server test
      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-server-e2e-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            logs/**
          if-no-files-found: warn

  lifecycle-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Build server module dependencies
        run: ./mvnw -q -pl xa-mass-server -am -DskipTests install
      - name: Run canonical server smoke checks
        run: >-
          ./mvnw -q -pl xa-mass-server
          -Dtest=TaskApiIntegrationTest,TaskApiFailureResultIntegrationTest,TaskApiLifecycleGuardsIntegrationTest,TaskApiMixedResultsIntegrationTest,TaskApiCallbackReplayIntegrationTest,TaskApiMultiRoundDispatchIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-lifecycle-integration-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            logs/**
          if-no-files-found: warn

  chaos-smokes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Run chaos smoke probes
        env:
          CHAOS_TIMEOUT_SECONDS: "30"
          CHAOS_PROCESSING_DELAY: "10"
        run: xa-mass-testing/scripts/run-chaos-smokes.sh
      - name: Upload chaos reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-smoke-reports
          path: |
            **/target/chaos-reports/**
          if-no-files-found: warn
