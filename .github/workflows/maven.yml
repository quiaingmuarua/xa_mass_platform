name: Maven CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and run module tests
        run: ./mvnw -B test --file pom.xml
      - name: Check xa-mass-sdk public API compatibility
        if: ${{ vars.XA_MASS_SDK_API_BASELINE_VERSION != '' }}
        run: >-
          ./mvnw -q -pl xa-mass-sdk -am
          -DskipTests
          -Dmass.sdk.api.baselineVersion=${{ vars.XA_MASS_SDK_API_BASELINE_VERSION }}
          verify

  lifecycle-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Run focused dev-app lifecycle integration checks
        run: >-
          ./mvnw -q -pl xa-mass-server -am
          -Dtest=TaskApiIntegrationTest,TaskApiFailureResultIntegrationTest,TaskApiLifecycleGuardsIntegrationTest,MassWebSocketClientImplTest,WebSocketClientStarterTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
