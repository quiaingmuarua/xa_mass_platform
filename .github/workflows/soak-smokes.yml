name: Soak Smokes

on:
  workflow_dispatch:
  schedule:
    - cron: "15 19 * * *"

jobs:
  polling-scheduling-fast-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Run polling scheduling fast soak
        env:
          MASS_SOAK_DURATION_SECONDS: "6"
          MASS_SOAK_WORKER_COUNT: "4"
          MASS_SOAK_INITIAL_WORKER_COUNT: "1"
          MASS_SOAK_LATE_WORKER_START_AFTER_MILLIS: "1000"
          MASS_SOAK_REQUIRE_LATE_WORKER_WORK: "true"
          MASS_SOAK_SUBMIT_RATE_PER_SECOND: "2"
          MASS_SOAK_MESSAGES_PER_TASK: "4"
          MASS_SOAK_POLL_BATCH_SIZE: "2"
          MASS_SOAK_PROCESSING_DELAY_MILLIS: "30"
          MASS_SOAK_FAILURE_EVERY_NTH: "2"
          MASS_SOAK_DRAIN_TIMEOUT_SECONDS: "60"
          MASS_SOAK_TRACE: "true"
        run: bash xa-mass-testing/scripts/run-polling-scheduling-fast-soak.sh
      - name: Upload soak reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polling-scheduling-fast-soak-reports
          path: |
            xa-mass-testing/target/soak-reports/**
            xa-mass-testing/target/soak-traces/**
          if-no-files-found: warn
