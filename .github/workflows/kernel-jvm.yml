name: Kernel JVM

on:
  push:
    branches: ["main"]
    paths:
      - "kernel_jvm/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/kernel-jvm.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "kernel_jvm/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/kernel-jvm.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify JVM scaffold
        run: bash ./gradlew --no-daemon build
