name: Kernel Design

on:
  push:
    branches: ["main"]
    paths:
      - "kernel_design/**"
      - ".github/workflows/kernel-design.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "kernel_design/**"
      - ".github/workflows/kernel-design.yml"
  workflow_dispatch:

jobs:
  executable-spec:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KERNEL_DESIGN_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kernel_design/runtime_server/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r kernel_design/runtime_server/requirements.txt
      - name: Run executable specification
        run: python -m unittest discover -s kernel_design/executable_spec/tests
      - name: Compile Python sources
        run: python -m compileall -q kernel_design/executable_spec
