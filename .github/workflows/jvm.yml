name: JVM

on:
  push:
    branches: ["main"]
    paths:
      - "kernel_jvm/**"
      - "scenario_workers_jvm/**"
      - "server_jvm/**"
      - "worker_delivery_contract_jvm/**"
      - "transport/**"
      - "integrations/**"
      - "kernel_design/runtime_server/**"
      - "kernel_design/executable_spec/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/jvm.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "kernel_jvm/**"
      - "scenario_workers_jvm/**"
      - "server_jvm/**"
      - "worker_delivery_contract_jvm/**"
      - "transport/**"
      - "integrations/**"
      - "kernel_design/runtime_server/**"
      - "kernel_design/executable_spec/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/jvm.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify JVM modules
        run: bash ./gradlew --no-daemon build

  runtime-api-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KERNEL_COMMAND_INTEGRATION_URL: http://127.0.0.1:18080
      KERNEL_DESIGN_REDIS_URL: redis://127.0.0.1:6379/15
      KERNEL_DESIGN_REDIS_PREFIX: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kernel_design/runtime_server/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r kernel_design/runtime_server/requirements.txt
      - name: Start Python Kernel Runtime Server
        run: |
          python -m kernel_design.runtime_server \
            --host 127.0.0.1 --port 18080 > kernel-runtime-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health')" ; then
              exit 0
            fi
            sleep 1
          done
          cat kernel-runtime-server.log
          exit 1
      - name: Verify Java to Python runtime boundary
        run: bash ./gradlew --no-daemon :server_jvm:integrationTest
      - name: Verify integration proofs were not skipped
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(
              Path("server_jvm/build/test-results/integrationTest").glob(
                  "TEST-*.xml"
              )
          )
          if not reports:
              raise SystemExit("No integration-test XML reports were produced")

          totals = {
              "tests": 0,
              "skipped": 0,
              "failures": 0,
              "errors": 0,
          }
          for report in reports:
              suite = ET.parse(report).getroot()
              for name in totals:
                  totals[name] += int(suite.attrib.get(name, "0"))

          print(
              "integration proof: "
              + ", ".join(f"{name}={value}" for name, value in totals.items())
          )
          if (
              totals["tests"] == 0
              or totals["skipped"] != 0
              or totals["failures"] != 0
              or totals["errors"] != 0
          ):
              raise SystemExit(
                  "Redis and cross-process integration proofs must all run"
              )
          PY
      - name: Print Kernel server log on failure
        if: failure()
        run: cat kernel-runtime-server.log

  scenario-workers-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XA_MASS_WORKER_PROPERTY_INDEX_REGISTRY_JSON: >-
        {"index.worker.region":"redis-hash"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kernel_design/runtime_server/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r kernel_design/runtime_server/requirements.txt
      - name: Build Scenario acceptance artifacts
        run: >-
          bash ./gradlew --no-daemon
          :server_jvm:bootJar
          :integrations:worker-capability-rpc:classes
      - name: Start Python Kernel Runtime Server
        run: |
          python -m kernel_design.runtime_server \
            --config integrations/worker-capability-rpc/kernel-config.json \
            > scenario-kernel.log 2>&1 &
          echo $! > scenario-kernel.pid
          for attempt in $(seq 1 60); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health')" ; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Start Server and Scenario Workers
        run: |
          SERVER_JAR=$(find server_jvm/build/libs \
            -name 'xa-mass-server-jvm-*.jar' \
            ! -name '*-plain.jar' -print -quit)
          test -n "$SERVER_JAR"
          java -jar "$SERVER_JAR" \
            --spring.profiles.active=scenario-workers \
            > scenario-server.log 2>&1 &
          echo $! > scenario-server.pid
          for attempt in $(seq 1 90); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18082/actuator/health/readiness')" ; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify 20 Workers and 60 targeted RPC calls
        run: >-
          bash ./gradlew --no-daemon
          :integrations:worker-capability-rpc:runRpcScenario
          --args="--scenario-id=ci-worker-capability
          --result-dir=ci-results
          --wait-timeout-millis=10000
          --request-timeout-millis=15000"
      - name: Verify Scenario result shape
        run: |
          python - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path
          from uuid import UUID

          root = Path(
              "integrations/worker-capability-rpc/ci-results/"
              "ci-worker-capability"
          )
          expected = {
              "phone-number.jsonl": {
                  "worker_group_id": "scenario-phone-number-workers",
                  "worker_key_prefix": "scenario-phone-number-worker-",
                  "event_codes": {
                      "phonenumber.e164",
                      "phonenumber.country",
                      "phonenumber.original-carrier",
                  },
              },
              "string-utils.jsonl": {
                  "worker_group_id": "scenario-string-utils-workers",
                  "worker_key_prefix": "scenario-string-utils-worker-",
                  "event_codes": {
                      "string.md5",
                      "string.sha1",
                      "string.base64.encode",
                  },
              },
          }
          total = 0
          all_worker_ids = set()
          for filename, contract in expected.items():
              path = root / filename
              records = [
                  json.loads(line)
                  for line in path.read_text(encoding="utf-8").splitlines()
                  if line
              ]
              if len(records) != 30:
                  raise SystemExit(f"{filename}: expected 30 results")
              worker_group_ids = {
                  record["workerGroupId"] for record in records
              }
              if worker_group_ids != {contract["worker_group_id"]}:
                  raise SystemExit(
                      f"{filename}: unexpected groups {worker_group_ids}"
                  )
              expected_worker_keys = {
                  f"{contract['worker_key_prefix']}{index:03d}"
                  for index in range(1, 11)
              }
              worker_ids_by_key = {}
              for record in records:
                  worker_key = record["clientWorkerKey"]
                  worker_id = record["workerId"]
                  existing = worker_ids_by_key.setdefault(
                      worker_key,
                      worker_id,
                  )
                  if existing != worker_id:
                      raise SystemExit(
                          f"{filename}: {worker_key} changed Worker ID"
                      )
                  if "input" not in record or "result" not in record:
                      raise SystemExit(f"{filename}: incomplete result record")
              if set(worker_ids_by_key) != expected_worker_keys:
                  raise SystemExit(f"{filename}: unexpected Worker keys")
              worker_ids = set(worker_ids_by_key.values())
              if len(worker_ids) != 10:
                  raise SystemExit(f"{filename}: expected 10 Worker IDs")
              for worker_id in worker_ids:
                  if str(UUID(worker_id)) != worker_id:
                      raise SystemExit(f"non-canonical Worker ID: {worker_id}")
              combinations = Counter(
                  (record["clientWorkerKey"], record["eventCode"])
                  for record in records
              )
              expected_combinations = Counter({
                  (worker_key, event_code): 1
                  for worker_key in expected_worker_keys
                  for event_code in contract["event_codes"]
              })
              if combinations != expected_combinations:
                  raise SystemExit(
                      f"{filename}: Worker/event coverage is incomplete"
                  )
              all_worker_ids.update(worker_ids)
              total += len(records)
          if total != 60:
              raise SystemExit(f"expected 60 results, received {total}")
          if len(all_worker_ids) != 20:
              raise SystemExit("Worker IDs must be global across both groups")
          print(f"Scenario Worker proof: results={total}, workers=20")
          PY
      - name: Print Scenario logs on failure
        if: failure()
        run: |
          for log in scenario-kernel.log scenario-server.log; do
            if [ -f "$log" ]; then
              echo "===== $log ====="
              cat "$log"
            fi
          done
      - name: Stop Scenario processes
        if: always()
        run: |
          for pid_file in scenario-server.pid scenario-kernel.pid; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
