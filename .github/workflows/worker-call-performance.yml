name: Worker Call Performance

# Performance lane (integrations/worker-call-performance/README.md): nightly trend and manual
# measurement build once, run one job per rate plus saturation, and merge; manual A/B compares
# one case against a baseline on a single runner.
on:
  schedule:
    - cron: '0 19 * * *' # 03:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      execution_target:
        description: Source reference measurement or published-Release external consumer
        type: choice
        default: source
        options: [source, external]
      external_workers_per_group:
        description: Workers per Group for the external consumer (two Groups)
        type: number
        default: 5000
      external_repetitions:
        description: Repetitions for the external consumer only
        type: choice
        default: '1'
        options: ['1', '3']
      repetitions:
        description: "Repetitions per case (path order rotates); nightly uses 3"
        type: choice
        default: '3'
        options:
          - '1'
          - '3'
      diagnostics:
        description: "Private Server/Host JFR with per-case export (diagnosis only; not an A/B input)"
        type: choice
        default: 'off'
        options:
          - 'off'
          - jfr
      baseline_ref:
        description: "A/B only: immutable baseline commit compared on lane_case"
        required: false
        type: string
        default: ''
      lane_case:
        description: "A/B only: one case (e.g. task-any-1000, sat-task-any) compared against baseline_ref"
        required: false
        type: string
        default: ''
      lane_record:
        description: "Store this run's record on the perf-lane-data branch for trend comparison (nightly always records)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_target == 'external' && 'release-preview-load' || 'worker-call-performance' }}
  cancel-in-progress: false

jobs:
  lane-build:
    name: Performance Lane Build
    if: (github.event_name == 'schedule' || inputs.execution_target != 'external') && (github.event_name == 'schedule' || inputs.baseline_ref == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-jvm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt
      - name: Install proof dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - name: Verify Harness and runner contracts
        run: |
          ./gradlew --no-daemon :integrations:worker-call-performance:test
          python -m unittest discover -s integrations/worker-call-performance -p 'test_*.py'
      - name: Build Server, Host and Harness once
        run: ./gradlew --no-daemon :integrations:worker-call-performance:experimentDist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: performance-lane-build-${{ github.run_attempt }}
          path: |
            server_boot_jvm/build/libs/*.jar
            worker_simulator_jvm/build/install/**
            integrations/worker-call-performance/build/install/**
            integrations/worker-call-performance/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 1

  lane:
    name: Performance Lane ${{ matrix.job }}
    needs: lane-build
    if: github.event_name == 'schedule' || inputs.execution_target != 'external'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: rate-500
            args: --lane-modes open --lane-rates 500
          - job: rate-1000
            args: --lane-modes open --lane-rates 1000
          - job: rate-2000
            args: --lane-modes open --lane-rates 2000
          - job: saturation
            args: --lane-modes saturation --experiment-config integrations/worker-call-performance/configs/lane-saturation.json
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-jvm
        with:
          gradle: 'false'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt
      - name: Install proof dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - uses: actions/download-artifact@v8.0.0
        with:
          name: performance-lane-build-${{ needs.lane-build.outputs.artifact_attempt }}
      - name: Run lane cases
        env:
          REPETITIONS: ${{ inputs.repetitions || '3' }}
          DIAGNOSTICS: ${{ inputs.diagnostics || 'off' }}
          LANE_ARGS: ${{ matrix.args }}
        run: |
          # shellcheck disable=SC2086 # LANE_ARGS is a fixed matrix value with separate options.
          python integrations/worker-call-performance/run_worker_call_performance.py --skip-build \
            --repetitions "$REPETITIONS" --diagnostics "$DIAGNOSTICS" $LANE_ARGS \
            --output-root "build/worker-call-performance-proof/lane-${{ matrix.job }}"
      - name: Publish job summary
        if: always()
        run: |
          summary="build/worker-call-performance-proof/lane-${{ matrix.job }}/evidence/summary.md"
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: lane-${{ matrix.job }}-${{ github.run_attempt }}
          path: build/worker-call-performance-proof/lane-${{ matrix.job }}/evidence/**
          if-no-files-found: error
          retention-days: 7

  lane-summary:
    name: Performance Lane Summary
    needs: lane
    if: always() && (github.event_name == 'schedule' || inputs.execution_target != 'external') && (github.event_name == 'schedule' || inputs.baseline_ref == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # Only for appending this run's record to the perf-lane-data branch.
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v8.0.0
        with:
          pattern: lane-*-${{ github.run_attempt }}
          path: build/lane-jobs
      - name: Read lane history from the data branch
        run: |
          if git fetch --depth=1 origin perf-lane-data; then
            git worktree add --detach build/lane-data FETCH_HEAD
          else
            echo "No perf-lane-data branch yet; trend comparison starts empty."
          fi
      - name: Merge lane jobs and compare with history
        id: merge
        run: |
          python integrations/worker-call-performance/run_worker_call_performance.py \
            --merge-lane build/lane-jobs --merge-jobs rate-500,rate-1000,rate-2000,saturation \
            --lane-history build/lane-data/runs --output-root build/worker-call-performance-proof/lane-merged
      - name: Record this run on the data branch
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.lane_record) && (steps.merge.outcome == 'success' || steps.merge.outcome == 'failure') }}
        run: |
          record="$GITHUB_WORKSPACE/build/worker-call-performance-proof/lane-merged/evidence/run-record.json"
          python - "$record" <<'PY'
          import json, os, sys
          from pathlib import Path
          record = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          identity = {"runId": "GITHUB_RUN_ID", "attempt": "GITHUB_RUN_ATTEMPT", "ref": "GITHUB_REF_NAME", "sha": "GITHUB_SHA"}
          fields = {"laneConfigVersion": int, "configurations": dict, "calibration": dict, "cases": dict}
          if (not isinstance(record, dict) or record.get("status") not in ("passed", "failed")
                  or any(record.get(key) != os.environ[name] for key, name in identity.items())
                  or any(type(record.get(key)) is not kind for key, kind in fields.items())
                  or record["laneConfigVersion"] < 1):
              raise SystemExit("Generated performance run record is invalid or belongs to another run")
          PY
          name="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          if [ ! -e build/lane-data/.git ]; then
            git worktree add --detach build/lane-data HEAD
            git -C build/lane-data checkout -q --orphan perf-lane-data
            git -C build/lane-data rm -rf -q .
          fi
          mkdir -p build/lane-data/runs
          cp "$record" "build/lane-data/runs/$name"
          # This orphan branch is evidence, not the frontend application.
          mkdir -p build/lane-data/frontend
          printf '%s\n' '{"git":{"deploymentEnabled":false}}' > build/lane-data/frontend/vercel.json
          cd build/lane-data
          git add runs frontend/vercel.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Record performance lane run ${GITHUB_RUN_ID} (${GITHUB_REF_NAME})"
          for attempt in 1 2 3; do
            if git push -q origin HEAD:refs/heads/perf-lane-data; then exit 0; fi
            git fetch -q --depth=50 origin perf-lane-data && git rebase -q FETCH_HEAD
          done
          exit 1
      - name: Publish merged summary
        if: always()
        run: |
          summary=build/worker-call-performance-proof/lane-merged/evidence/summary.md
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: lane-merged-${{ github.run_attempt }}
          path: build/worker-call-performance-proof/lane-merged/evidence/**
          if-no-files-found: error
          retention-days: 7

  lane-ab:
    name: Performance Lane A/B
    if: github.event_name == 'workflow_dispatch' && inputs.execution_target != 'external' && inputs.baseline_ref != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-jvm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt
      - name: Install proof dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - name: Read lane history for the comparison band
        run: |
          if git fetch --depth=1 origin perf-lane-data; then
            git worktree add --detach build/lane-data FETCH_HEAD
          fi
      - name: Run sequential per-case A/B
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
          LANE_CASE: ${{ inputs.lane_case }}
        run: |
          # A saturation A/B runs the saturation job's configured world.
          config=()
          case "$LANE_CASE" in
            sat-*) config=(--experiment-config integrations/worker-call-performance/configs/lane-saturation.json) ;;
          esac
          python integrations/worker-call-performance/run_worker_call_performance.py \
            --baseline-ref "$BASELINE_REF" --lane-case "$LANE_CASE" --lane-history build/lane-data/runs \
            "${config[@]}" --output-root build/worker-call-performance-proof/lane-ab
      - name: Publish A/B summary
        if: always()
        run: |
          summary=build/worker-call-performance-proof/lane-ab/evidence/summary.md
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: lane-ab-${{ github.run_attempt }}
          path: build/worker-call-performance-proof/lane-ab/**/evidence/**
          if-no-files-found: error
          retention-days: 7

  external-performance:
    name: External Performance (2 x ${{ inputs.external_workers_per_group }} Workers)
    if: github.event_name == 'workflow_dispatch' && inputs.execution_target == 'external' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/external-performance-consumer.yml
    with:
      workers_per_group: ${{ fromJSON(inputs.external_workers_per_group) }}
      repetitions: ${{ inputs.external_repetitions }}
      diagnostics: ${{ inputs.diagnostics }}
      baseline_ref: ${{ inputs.baseline_ref }}
      lane_case: ${{ inputs.lane_case }}
      lane_record: ${{ inputs.lane_record }}
    secrets: inherit
