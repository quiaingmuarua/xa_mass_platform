name: Redis Runtime CI

on:
  push:
    branches: ["main"]
    paths:
      - "platform_infra/mass-runtime-redis/**"
      - "platform_infra/mass-runtime-api/**"
      - "platform_infra/mass-queue-primitives/**"
      - "xa-mass-engine/**"
      - "sdk/**"
      - "xa-mass-server/**"
      - ".github/workflows/redis-runtime.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "platform_infra/mass-runtime-redis/**"
      - "platform_infra/mass-runtime-api/**"
      - "platform_infra/mass-queue-primitives/**"
      - "xa-mass-engine/**"
      - "sdk/**"
      - "xa-mass-server/**"
      - ".github/workflows/redis-runtime.yml"
  workflow_dispatch:
  schedule:
    - cron: "45 18 * * *"

concurrency:
  group: redis-runtime-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  redis-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run Redis runtime focused module tests
        run: ./mvnw -B -pl platform_infra/mass-runtime-redis -am test

      - name: Build server module dependencies
        run: ./mvnw -B -pl xa-mass-server -am -DskipTests install

      - name: Run Redis runtime focused server smoke
        run: >-
          ./mvnw -B -pl xa-mass-server
          -Dtest=RedisRuntimeLateReplayE2eScenario
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Write proof summary
        if: always()
        run: >-
          node xa-mass-testing/scripts/write-proof-summary.mjs
          --job redis-runtime
          --test-report-dir platform_infra/mass-runtime-redis/target/surefire-reports
          --test-report-dir platform_infra/mass-runtime-redis/target/failsafe-reports
          --test-report-dir xa-mass-server/target/surefire-reports
          --test-report-dir xa-mass-server/target/failsafe-reports

      - name: Upload Redis runtime test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-runtime-reports
          path: |
            platform_infra/mass-runtime-redis/target/surefire-reports/**
            platform_infra/mass-runtime-redis/target/failsafe-reports/**
            xa-mass-server/target/surefire-reports/**
            xa-mass-server/target/failsafe-reports/**
            xa-mass-testing/target/proof-summary/**
          if-no-files-found: warn
