name: Prepare XA Mass Runtime And Worker SDK Draft

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-xa-mass-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Promote verified ZIPs to Draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release promotion contracts
        run: python3 .github/scripts/test_prepare_release.py -v
      - name: Prepare exact verified release assets
        run: >-
          python3 .github/scripts/prepare_release.py
          --repository "$GITHUB_REPOSITORY"
          --tag "$GITHUB_REF_NAME"
          --commit "$(git rev-parse HEAD)"
      - name: Summarize draft
        run: |
          echo "Draft prepared from the complete manual Proof ZIPs; publish after consumer acceptance." >> "$GITHUB_STEP_SUMMARY"
