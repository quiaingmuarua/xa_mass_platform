name: Release Server Runtime

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-server-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish immutable Server Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GH_TOKEN: ${{ github.token }}
      XA_MASS_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate immutable release coordinate
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be v<major>.<minor>.<patch>"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit must already belong to main"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists and will not be overwritten"
            exit 1
          fi
          echo "XA_MASS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11.3'
          cache: pip
          cache-dependency-path: |
            kernel_design/pyproject.toml
            kernel_design/requirements-runtime.lock
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build and prove release archive
        shell: bash
        run: |
          ./gradlew --no-daemon \
            :distribution:server:runtimeDistributionTest \
            -PxaMassVersion="$XA_MASS_VERSION"
      - name: Generate release checksum
        id: asset
        shell: bash
        run: |
          asset="distribution/server/build/distributions/xa-mass-server-runtime-${XA_MASS_VERSION}.zip"
          test -f "$asset"
          sha256sum "$asset" > "$asset.sha256"
          echo "archive=$asset" >> "$GITHUB_OUTPUT"
          echo "checksum=$asset.sha256" >> "$GITHUB_OUTPUT"
      - name: Publish immutable GitHub Release
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.asset.outputs.archive }}" \
            "${{ steps.asset.outputs.checksum }}" \
            --verify-tag \
            --title "XA Mass Server Runtime $GITHUB_REF_NAME" \
            --generate-notes
