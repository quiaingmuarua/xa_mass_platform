name: Worker Loaded Commit Slices

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-loaded-slices-${{ github.run_id }}
  cancel-in-progress: false

env:
  XA_MASS_REDIS_EPHEMERAL: "true"

jobs:
  worker-loaded-recovery:
    name: Loaded slice ${{ matrix.label }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - label: baseline-4a
            ref: 4a5ccb3f7022471fd605d2041fa1a2f1f7a70093
          - label: original-0e
            ref: 0e2a0302b878ac01d482d2b1f3e4d9ec874fac77
          - label: minus-observation
            ref: fb86a93d7ab1663a67a6e43dff7981e1adee9662
          - label: minus-window
            ref: 333d1714db8970007d604604172f333d08e090e2
          - label: minus-batch
            ref: 08444a82f181b106a6ffe7ce57e8f44dc2ee89bd
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt
      - name: Install Python proof dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - name: Configure local connection port range
        run: sudo sysctl -w net.ipv4.ip_local_port_range="10000 65535"
      - name: Verify loaded recovery owner contracts
        run: |
          ./gradlew --no-daemon \
            :transport:java-worker:test \
            :worker_simulator_jvm:test \
            :integrations:worker-loaded-recovery:test
          python -m unittest \
            integrations.worker_proof_support.test_scenario_inventory
          python -m unittest discover \
            -s integrations/worker-loaded-recovery \
            -p 'test_*.py'
      - name: Run Worker Loaded Capacity + Recovery Stability
        run: |
          python integrations/worker-loaded-recovery/run_worker_loaded_recovery.py \
            --prepared-workers 15000 \
            --retained-workers 10000 \
            --minimum-initial-converged 14800 \
            --minimum-retained-converged 9900 \
            --workload-items-per-task 5000 \
            --redis-url redis://127.0.0.1:6379/15 \
            --output-root build/worker-loaded-recovery-proof
      - name: Upload loaded recovery evidence and process logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: worker-loaded-${{ matrix.label }}-${{ github.run_attempt }}
          path: |
            build/worker-loaded-recovery-proof/evidence/**
            build/worker-loaded-recovery-proof/process-resources.jsonl
            build/worker-loaded-recovery-proof/*.log
            integrations/worker-loaded-recovery/build/test-results/test/**
            integrations/worker-loaded-recovery/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 7
