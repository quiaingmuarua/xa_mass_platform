name: Product Coexistence

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      scenario:
        description: Fixed acceptance workload
        type: choice
        default: small
        options: [small, load-1k]

permissions:
  contents: read

jobs:
  product-proof:
    name: Shared products and recipient outcomes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4.10
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install fixed proof prerequisites
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          python -m pip install -r distribution/server/requirements-preview.txt
      - name: Owner tests and real product composition
        run: |
          ./gradlew :scenarios:app-checks-jvm:test :scenarios:message-campaigns-jvm:test :scenarios:sms-reception-jvm:test :worker_simulator_jvm:test :server_boot_jvm:test :server_boot_jvm:scenarioCompositionIntegrationTest :distribution:server:stagePreviewServer :distribution:server:stagePreviewHost :distribution:server:stagePreviewFrontend --console=plain
          python -m unittest discover -s integrations/scenario-coexistence -p 'test_*.py'
          python -m unittest discover -s scenarios/app-checks-jvm -p 'test_*.py'
          ./gradlew :distribution:server:previewLauncherTest --console=plain
          corepack pnpm@11.9.0 --dir frontend lint
          corepack pnpm@11.9.0 --dir frontend typecheck
          corepack pnpm@11.9.0 --dir frontend test
      - name: Twelve shared Workers and lifecycle isolation
        if: inputs.scenario != 'load-1k'
        run: |
          python integrations/scenario-coexistence/run_proof.py --scenario functional --output integrations/scenario-coexistence/build/ci-functional
          python integrations/scenario-coexistence/run_proof.py --scenario lifecycle --port 18540 --output integrations/scenario-coexistence/build/ci-lifecycle
          python scenarios/app-checks-jvm/run_acceptance.py --port 18620 --output scenarios/app-checks-jvm/build/ci-source
      - name: Explicit 1000 Worker combined acceptance
        if: inputs.scenario == 'load-1k'
        run: python integrations/scenario-coexistence/run_proof.py --scenario load-1k --port 18560 --output integrations/scenario-coexistence/build/ci-1k
      - name: Fresh unified Preview archive
        if: inputs.scenario != 'load-1k'
        run: |
          ./gradlew :distribution:server:previewZip --console=plain
          python distribution/server/src/test/python/verify_preview_archive.py --archive distribution/server/build/distributions/xa-mass-scenario-preview-0.1.0-preview.zip --frontend frontend/dist --output integrations/scenario-coexistence/build/archive.json
          python -m zipfile -e distribution/server/build/distributions/xa-mass-scenario-preview-0.1.0-preview.zip distribution/server/build/preview/ci-unpacked
          python integrations/scenario-coexistence/run_proof.py --scenario functional --port 18580 --root distribution/server/build/preview/ci-unpacked/xa-mass-scenario-preview-0.1.0-preview --output integrations/scenario-coexistence/build/ci-zip-functional
          python scenarios/app-checks-jvm/run_acceptance.py --port 18640 --root distribution/server/build/preview/ci-unpacked/xa-mass-scenario-preview-0.1.0-preview --output scenarios/app-checks-jvm/build/ci-zip
      - name: Upload safe summaries only
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: product-coexistence-proof-${{ github.run_attempt }}
          path: |
            integrations/scenario-coexistence/build/ci-functional/summary.json
            integrations/scenario-coexistence/build/ci-lifecycle/summary.json
            integrations/scenario-coexistence/build/ci-1k/summary.json
            integrations/scenario-coexistence/build/ci-zip-functional/summary.json
            integrations/scenario-coexistence/build/archive.json
            scenarios/app-checks-jvm/build/ci-source/summary.json
            scenarios/app-checks-jvm/build/ci-zip/summary.json
          if-no-files-found: warn
          retention-days: 7
