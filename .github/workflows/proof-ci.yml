name: Proof CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: proof-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select proof lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jvm_contracts: ${{ steps.filter.outputs.jvm_contracts }}
      redis_owner: ${{ steps.filter.outputs.redis_owner }}
      runtime_boundary: ${{ steps.filter.outputs.runtime_boundary }}
      worker_correctness: ${{ steps.filter.outputs.worker_correctness }}
      worker_convergence_health: ${{ steps.filter.outputs.worker_convergence_health }}
      android_host: ${{ steps.filter.outputs.android_host }}
      android_emulator: ${{ steps.filter.outputs.android_emulator }}
      frontend: ${{ steps.filter.outputs.frontend }}
      runtime_distribution: ${{ steps.filter.outputs.runtime_distribution }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify proof selection contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 -m unittest discover \
            -s .github/scripts \
            -p 'test_*.py'
          python3 .github/scripts/check_proof_selection.py
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            proof_base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && \
                  "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            proof_base="$PUSH_BEFORE_SHA"
          else
            proof_base="$(git rev-parse HEAD^)"
          fi
          python3 .github/scripts/explain_proof_selection.py --base "$proof_base"
      - id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: .github/proof-paths.yml
          predicate-quantifier: some-with-excludes
  docs-contract:
    name: Docs Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify current documentation contract
        run: python3 .github/scripts/check_docs.py

  jvm-contracts:
    name: JVM Contracts
    needs: changes
    if: >-
      needs.changes.outputs.jvm_contracts == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify JVM contracts and owner boundaries
        run: >-
          ./gradlew --no-daemon --continue
          :transport:worker-delivery-contract:build
          :kernel_jvm:build
          :kernel_pacer_jvm:build
          :transport:worker-core:build
          :transport:java-worker:build
          :transport:netty-adapter:build
          :scenario_workers_jvm:build
          :server_jvm:build
          :integrations:worker-correctness:build
          :integrations:worker-convergence-health:build
          :integrations:worker-websocket-scale:build
          :distribution:server:verifyPlatformDiagnosticCodes
      - name: Verify Worker WebSocket scale runner contract
        run: >-
          python3 -m unittest discover
          -s integrations/worker-websocket-scale
          -p 'test_*.py'
      - name: Summarize JVM proof
        if: always()
        run: >-
          python3 .github/scripts/summarize_junit.py
          --label "JVM Contracts"
          "**/build/test-results/test/TEST-*.xml"
      - name: Upload JVM failure reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jvm-contracts-${{ github.run_attempt }}
          path: |
            **/build/test-results/test/**
            **/build/reports/tests/test/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  redis-owner:
    name: Redis Owner
    needs: changes
    if: >-
      needs.changes.outputs.redis_owner == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify Redis owner contracts
        run: >-
          ./gradlew --no-daemon
          :server_jvm:redisOwnerIntegrationTest
      - name: Summarize Redis proof
        if: always()
        run: >-
          python3 .github/scripts/summarize_junit.py
          --label "Redis Owner"
          "server_jvm/build/test-results/redisOwnerIntegrationTest/TEST-*.xml"
      - name: Upload Redis failure reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: redis-owner-${{ github.run_attempt }}
          path: |
            server_jvm/build/test-results/redisOwnerIntegrationTest/**
            server_jvm/build/reports/tests/redisOwnerIntegrationTest/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  runtime-boundary:
    name: Runtime Boundary
    needs: changes
    if: >-
      needs.changes.outputs.runtime_boundary == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Verify Java-owned Runtime boundary
        run: >-
          ./gradlew --no-daemon
          :server_jvm:runtimeBoundaryIntegrationTest
      - name: Summarize Runtime proof
        if: always()
        run: >-
          python .github/scripts/summarize_junit.py
          --label "Runtime Boundary"
          "server_jvm/build/test-results/runtimeBoundaryIntegrationTest/TEST-*.xml"
      - name: Upload Runtime failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-boundary-${{ github.run_attempt }}
          path: |
            server_jvm/build/test-results/runtimeBoundaryIntegrationTest/**
            server_jvm/build/reports/tests/runtimeBoundaryIntegrationTest/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  worker-correctness:
    name: Worker Correctness
    needs: changes
    if: >-
      needs.changes.outputs.worker_correctness == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt
      - name: Install Python proof dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - name: Prove Worker correctness
        run: >-
          python integrations/worker-correctness/run_worker_correctness.py
          --redis-url redis://127.0.0.1:6379/15
          --output-root "$GITHUB_WORKSPACE/build/worker-correctness-proof"
      - name: Summarize Worker correctness proof
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "- **Worker Correctness:** workers=20, taskItems=100, restartIdentity=matched" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Worker Correctness:** failed; inspect evidence and process logs" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Worker correctness evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: worker-correctness-${{ github.run_attempt }}
          path: |
            build/worker-correctness-proof/**
          if-no-files-found: ignore
          retention-days: 7

  worker-convergence-health:
    name: Worker Convergence Health
    needs: changes
    if: >-
      needs.changes.outputs.worker_convergence_health == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt
      - name: Install Python proof dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - name: Prove Worker convergence health
        run: >-
          python integrations/worker-convergence-health/run_worker_convergence_health.py
          --scenario all
          --redis-url redis://127.0.0.1:6379/15
          --output-root "$GITHUB_WORKSPACE/build/worker-convergence-health-proof"
      - name: Summarize Worker convergence health proof
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "- **Worker Convergence Health:** workers=100, taskItems=1000, scenarios=2" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Worker Convergence Health:** failed; inspect per-scenario evidence" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Worker convergence evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: worker-convergence-health-${{ github.run_attempt }}
          path: |
            build/worker-convergence-health-proof/**
          if-no-files-found: ignore
          retention-days: 7

  android-host:
    name: Android Host
    needs: changes
    if: >-
      needs.changes.outputs.android_host == 'true' ||
      needs.changes.outputs.android_emulator == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Verify Android Worker and demo host
        run: >-
          ./gradlew --no-daemon --continue
          :transport:android-worker:testDebugUnitTest
          :transport:android-worker:assembleDebug
          :xa-android:capabilities:testDebugUnitTest
          :xa-android:capabilities:assembleDebug
          :xa-android:capability-http:testDebugUnitTest
          :xa-android:capability-http:assembleDebug
          :xa-android:worker-demo:testDebugUnitTest
          :xa-android:worker-demo:assembleDebug
      - name: Verify Android Task RPC host driver
        run: >-
          python -m unittest discover
          -s xa-android/worker-demo/host
          -p "test_*.py"
      - name: Upload Android Worker Demo APK
        if: >-
          needs.changes.outputs.android_emulator == 'true' ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-worker-demo-apk
          path: xa-android/worker-demo/build/outputs/apk/debug/xa-mass-android-worker-demo-debug.apk
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Summarize Android proof
        if: always()
        run: >-
          python .github/scripts/summarize_junit.py
          --label "Android Host"
          "**/build/test-results/testDebugUnitTest/TEST-*.xml"
      - name: Upload Android failure reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-host-${{ github.run_attempt }}
          path: |
            transport/android-worker/build/test-results/testDebugUnitTest/**
            transport/android-worker/build/reports/tests/testDebugUnitTest/**
            xa-android/capabilities/build/test-results/testDebugUnitTest/**
            xa-android/capabilities/build/reports/tests/testDebugUnitTest/**
            xa-android/capability-http/build/test-results/testDebugUnitTest/**
            xa-android/capability-http/build/reports/tests/testDebugUnitTest/**
            xa-android/worker-demo/build/test-results/testDebugUnitTest/**
            xa-android/worker-demo/build/reports/tests/testDebugUnitTest/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  android-emulator-worker:
    name: Android Emulator Worker
    needs:
      - changes
      - android-host
    if: >-
      always() &&
      (needs.changes.outputs.android_emulator == 'true' ||
      github.event_name == 'workflow_dispatch') &&
      needs.android-host.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: android-emulator-worker-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANDROID_API_LEVEL: "33"
      ANDROID_WORKER_PROOF_ROOT: ${{ github.workspace }}/build/android-emulator-proof
      ANDROID_WORKER_APK: ${{ github.workspace }}/build/android-emulator-proof/apk/xa-mass-android-worker-demo-debug.apk
      XA_MASS_REDIS_SCOPE: test_android_emulator_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - name: Download Android Worker Demo APK
        uses: actions/download-artifact@v8.0.0
        with:
          name: android-worker-demo-apk
          path: build/android-emulator-proof/apk
      - name: Build Scenario Server
        run: ./gradlew --no-daemon :server_jvm:bootJar
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove Android Worker on API 33 Emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none
          script: bash .github/scripts/run_android_emulator_worker.sh
      - name: Clean exact Android Redis scope
        if: always()
        run: >-
          python .github/scripts/cleanup_redis_test_scope.py
          --redis-url redis://127.0.0.1:6379/15
          --scope "$XA_MASS_REDIS_SCOPE"
      - name: Summarize Android Emulator Worker proof
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "- **Android Emulator Worker:** API=33, lifecycle=closed, identity=stable, route=connected, probe=observed, processRestart=matched" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Android Emulator Worker:** failed; inspect safe evidence and filtered logs" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Android Emulator Worker evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-emulator-worker-${{ github.run_attempt }}
          path: |
            build/android-emulator-proof/evidence/*.json
            build/android-emulator-proof/logs/server-*.log
            build/android-emulator-proof/logs/android-filtered.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Build Vercel demo
        run: pnpm build:demo
      - name: Summarize Frontend proof
        if: always()
        run: |
          echo "- **Frontend:** ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  runtime-distribution:
    name: Runtime And Worker SDK Distribution
    needs: changes
    if: >-
      needs.changes.outputs.runtime_distribution == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XA_MASS_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11.3"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build and prove Runtime and Worker SDK archives
        run: >-
          ./gradlew --no-daemon
          :distribution:server:runtimeDistributionTest
          :distribution:worker-sdk:workerSdkDistributionTest
          -PxaMassVersion=0.5.0
      - name: Summarize Distribution proof
        if: always()
        run: |
          echo "- **Runtime and Worker SDK Distribution:** ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Runtime archive
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: xa-mass-server-runtime-${{ github.run_attempt }}
          path: distribution/server/build/distributions/xa-mass-server-runtime-0.5.0.zip
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Worker SDK archive
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: xa-mass-worker-sdk-${{ github.run_attempt }}
          path: distribution/worker-sdk/build/distributions/xa-mass-worker-sdk-0.5.0.zip
          if-no-files-found: ignore
          retention-days: 7

  proof-gate:
    name: Proof Gate
    if: always()
    needs:
      - changes
      - jvm-contracts
      - redis-owner
      - runtime-boundary
      - worker-correctness
      - worker-convergence-health
      - android-host
      - android-emulator-worker
      - frontend
      - runtime-distribution
      - docs-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      EVENT_NAME: ${{ github.event_name }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      JVM_CONTRACTS_SELECTED: ${{ needs.changes.outputs.jvm_contracts }}
      JVM_CONTRACTS_RESULT: ${{ needs.jvm-contracts.result }}
      REDIS_OWNER_SELECTED: ${{ needs.changes.outputs.redis_owner }}
      REDIS_OWNER_RESULT: ${{ needs.redis-owner.result }}
      RUNTIME_BOUNDARY_SELECTED: ${{ needs.changes.outputs.runtime_boundary }}
      RUNTIME_BOUNDARY_RESULT: ${{ needs.runtime-boundary.result }}
      WORKER_CORRECTNESS_SELECTED: ${{ needs.changes.outputs.worker_correctness }}
      WORKER_CORRECTNESS_RESULT: ${{ needs.worker-correctness.result }}
      WORKER_CONVERGENCE_HEALTH_SELECTED: ${{ needs.changes.outputs.worker_convergence_health }}
      WORKER_CONVERGENCE_HEALTH_RESULT: ${{ needs.worker-convergence-health.result }}
      ANDROID_HOST_SELECTED: ${{ needs.changes.outputs.android_host == 'true' || needs.changes.outputs.android_emulator == 'true' }}
      ANDROID_HOST_RESULT: ${{ needs.android-host.result }}
      ANDROID_EMULATOR_SELECTED: ${{ needs.changes.outputs.android_emulator }}
      ANDROID_EMULATOR_RESULT: ${{ needs.android-emulator-worker.result }}
      FRONTEND_SELECTED: ${{ needs.changes.outputs.frontend }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      RUNTIME_DISTRIBUTION_SELECTED: ${{ needs.changes.outputs.runtime_distribution }}
      RUNTIME_DISTRIBUTION_RESULT: ${{ needs.runtime-distribution.result }}
      DOCS_RESULT: ${{ needs.docs-contract.result }}
    steps:
      - name: Require every selected proof lane
        shell: bash
        run: |
          failed=0
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change classification failed: $CHANGES_RESULT"
            failed=1
          fi

          check_lane() {
            name=$1
            selected=$2
            result=$3
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              selected=true
            fi
            if [ "$selected" = "true" ]; then
              expected=success
            else
              expected=skipped
            fi
            echo "- **$name:** selected=$selected, result=$result" \
              >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "$expected" ]; then
              echo "$name expected $expected but was $result"
              failed=1
            fi
          }

          check_lane \
            "JVM Contracts" "$JVM_CONTRACTS_SELECTED" "$JVM_CONTRACTS_RESULT"
          check_lane \
            "Redis Owner" "$REDIS_OWNER_SELECTED" "$REDIS_OWNER_RESULT"
          check_lane \
            "Runtime Boundary" "$RUNTIME_BOUNDARY_SELECTED" "$RUNTIME_BOUNDARY_RESULT"
          check_lane \
            "Worker Correctness" "$WORKER_CORRECTNESS_SELECTED" "$WORKER_CORRECTNESS_RESULT"
          check_lane \
            "Worker Convergence Health" "$WORKER_CONVERGENCE_HEALTH_SELECTED" "$WORKER_CONVERGENCE_HEALTH_RESULT"
          check_lane \
            "Android Host" "$ANDROID_HOST_SELECTED" "$ANDROID_HOST_RESULT"
          check_lane \
            "Android Emulator Worker" "$ANDROID_EMULATOR_SELECTED" "$ANDROID_EMULATOR_RESULT"
          check_lane \
            "Frontend" "$FRONTEND_SELECTED" "$FRONTEND_RESULT"
          check_lane \
            "Runtime Distribution" "$RUNTIME_DISTRIBUTION_SELECTED" "$RUNTIME_DISTRIBUTION_RESULT"
          check_lane \
            "Docs Contract" "true" "$DOCS_RESULT"

          exit "$failed"
