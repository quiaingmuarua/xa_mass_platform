name: Proof CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: proof-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select proof lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kernel_oracle: ${{ steps.filter.outputs.kernel_oracle }}
      jvm_contracts: ${{ steps.filter.outputs.jvm_contracts }}
      redis_owner: ${{ steps.filter.outputs.redis_owner }}
      runtime_boundary: ${{ steps.filter.outputs.runtime_boundary }}
      scenario_rpc: ${{ steps.filter.outputs.scenario_rpc }}
      android_host: ${{ steps.filter.outputs.android_host }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            kernel_oracle:
              - 'kernel_design/executable_spec/**'
              - 'kernel_design/runtime_server/**'
              - '.github/workflows/proof-ci.yml'
              - '.github/scripts/**'
            jvm_contracts:
              - 'kernel_jvm/**'
              - 'scenario_rpc_jvm/**'
              - 'scenario_workers_jvm/**'
              - 'server_jvm/**'
              - 'worker_delivery_contract_jvm/**'
              - 'transport/worker-core/**'
              - 'transport/java-worker/**'
              - 'transport/netty-adapter/**'
              - 'integrations/worker-capability-rpc/**'
              - 'kernel_design/executable_spec/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/proof-ci.yml'
              - '.github/scripts/**'
            redis_owner:
              - 'kernel_jvm/**'
              - 'server_jvm/**'
              - 'worker_delivery_contract_jvm/**'
              - 'kernel_design/executable_spec/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/proof-ci.yml'
              - '.github/scripts/**'
            runtime_boundary:
              - 'kernel_design/executable_spec/**'
              - 'kernel_design/runtime_server/**'
              - 'kernel_jvm/**'
              - 'server_jvm/**'
              - 'worker_delivery_contract_jvm/**'
              - 'transport/worker-core/**'
              - 'transport/java-worker/**'
              - 'transport/netty-adapter/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/proof-ci.yml'
              - '.github/scripts/**'
            scenario_rpc:
              - 'kernel_design/executable_spec/**'
              - 'kernel_design/runtime_server/**'
              - 'kernel_jvm/**'
              - 'scenario_rpc_jvm/**'
              - 'scenario_workers_jvm/**'
              - 'server_jvm/**'
              - 'worker_delivery_contract_jvm/**'
              - 'transport/worker-core/**'
              - 'transport/java-worker/**'
              - 'transport/netty-adapter/**'
              - 'integrations/worker-capability-rpc/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/proof-ci.yml'
              - '.github/scripts/**'
            android_host:
              - 'worker_delivery_contract_jvm/**'
              - 'transport/worker-core/**'
              - 'transport/android-worker/**'
              - 'integrations/android-websocket-worker/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/proof-ci.yml'
              - '.github/scripts/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/proof-ci.yml'
              - '.github/scripts/**'

  kernel-oracle:
    name: Kernel Oracle
    needs: changes
    if: >-
      needs.changes.outputs.kernel_oracle == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KERNEL_DESIGN_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kernel_design/runtime_server/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r kernel_design/runtime_server/requirements.txt
      - name: Run executable specification
        run: >-
          python -m unittest discover
          -s kernel_design/executable_spec/tests
          2>&1 | tee kernel-oracle.log
      - name: Compile Python sources
        run: python -m compileall -q kernel_design/executable_spec
      - name: Summarize Kernel proof
        if: always()
        run: |
          echo "- **Kernel Oracle:** ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Kernel failure log
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kernel-oracle-${{ github.run_attempt }}
          path: kernel-oracle.log
          if-no-files-found: ignore
          retention-days: 7

  jvm-contracts:
    name: JVM Contracts
    needs: changes
    if: >-
      needs.changes.outputs.jvm_contracts == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify JVM contracts and owner boundaries
        run: >-
          ./gradlew --no-daemon --continue
          :worker_delivery_contract_jvm:build
          :kernel_jvm:build
          :scenario_rpc_jvm:build
          :transport:worker-core:build
          :transport:java-worker:build
          :transport:netty-adapter:build
          :scenario_workers_jvm:build
          :server_jvm:build
          :integrations:worker-capability-rpc:build
      - name: Summarize JVM proof
        if: always()
        run: >-
          python3 .github/scripts/summarize_junit.py
          --label "JVM Contracts"
          "**/build/test-results/test/TEST-*.xml"
      - name: Upload JVM failure reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jvm-contracts-${{ github.run_attempt }}
          path: |
            **/build/test-results/test/**
            **/build/reports/tests/test/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  redis-owner:
    name: Redis Owner
    needs: changes
    if: >-
      needs.changes.outputs.redis_owner == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KERNEL_DESIGN_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify Redis owner contracts
        run: >-
          ./gradlew --no-daemon
          :server_jvm:redisOwnerIntegrationTest
      - name: Summarize Redis proof
        if: always()
        run: >-
          python3 .github/scripts/summarize_junit.py
          --label "Redis Owner"
          "server_jvm/build/test-results/redisOwnerIntegrationTest/TEST-*.xml"
      - name: Upload Redis failure reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: redis-owner-${{ github.run_attempt }}
          path: |
            server_jvm/build/test-results/redisOwnerIntegrationTest/**
            server_jvm/build/reports/tests/redisOwnerIntegrationTest/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  runtime-boundary:
    name: Runtime Boundary
    needs: changes
    if: >-
      needs.changes.outputs.runtime_boundary == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KERNEL_COMMAND_INTEGRATION_URL: http://127.0.0.1:18080
      KERNEL_DESIGN_REDIS_URL: redis://127.0.0.1:6379/15
      KERNEL_DESIGN_REDIS_PREFIX: default
      XA_MASS_WORKER_PROPERTY_INDEX_REGISTRY_JSON: >-
        {"index.worker.region":"redis-hash","index.platform.pool":"redis-hash"}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kernel_design/runtime_server/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r kernel_design/runtime_server/requirements.txt
      - name: Start Python Kernel Runtime Server
        run: |
          python -m kernel_design.runtime_server \
            --host 127.0.0.1 --port 18080 \
            > runtime-kernel.log 2>&1 &
          echo $! > runtime-kernel.pid
          for attempt in $(seq 1 30); do
            if python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health')" \
              >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat runtime-kernel.log
          exit 1
      - name: Verify Java and Python Runtime boundary
        run: >-
          ./gradlew --no-daemon
          :server_jvm:runtimeBoundaryIntegrationTest
      - name: Summarize Runtime proof
        if: always()
        run: >-
          python .github/scripts/summarize_junit.py
          --label "Runtime Boundary"
          "server_jvm/build/test-results/runtimeBoundaryIntegrationTest/TEST-*.xml"
      - name: Stop Runtime Kernel
        if: always()
        run: |
          if [ -f runtime-kernel.pid ]; then
            pid=$(cat runtime-kernel.pid)
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 10); do
              if ! kill -0 "$pid" 2>/dev/null; then
                exit 0
              fi
              sleep 1
            done
            kill -9 "$pid" 2>/dev/null || true
          fi
      - name: Upload Runtime failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-boundary-${{ github.run_attempt }}
          path: |
            runtime-kernel.log
            server_jvm/build/test-results/runtimeBoundaryIntegrationTest/**
            server_jvm/build/reports/tests/runtimeBoundaryIntegrationTest/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  scenario-rpc:
    name: Scenario RPC
    needs: changes
    if: >-
      needs.changes.outputs.scenario_rpc == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XA_MASS_WORKER_PROPERTY_INDEX_REGISTRY_JSON: >-
        {"index.worker.region":"redis-hash"}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kernel_design/runtime_server/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r kernel_design/runtime_server/requirements.txt
      - name: Build Scenario acceptance artifacts
        run: >-
          ./gradlew --no-daemon
          :server_jvm:bootJar
          :integrations:worker-capability-rpc:classes
      - name: Start Scenario Kernel
        run: |
          python -m kernel_design.runtime_server \
            --config integrations/worker-capability-rpc/kernel-config.json \
            > scenario-kernel.log 2>&1 &
          echo $! > scenario-kernel.pid
          for attempt in $(seq 1 60); do
            if python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health')" \
              >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat scenario-kernel.log
          exit 1
      - name: Start Server and Scenario Workers
        run: |
          SERVER_JAR=$(find server_jvm/build/libs \
            -name 'xa-mass-server-jvm-*.jar' \
            ! -name '*-plain.jar' -print -quit)
          test -n "$SERVER_JAR"
          java -jar "$SERVER_JAR" \
            --spring.profiles.active=scenario-workers \
            > scenario-server.log 2>&1 &
          echo $! > scenario-server.pid
          for attempt in $(seq 1 90); do
            if python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18082/actuator/health/readiness')" \
              >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat scenario-server.log
          exit 1
      - name: Verify 20 Workers and 6 Server Scenario RPC runs
        run: >-
          ./gradlew --no-daemon
          :integrations:worker-capability-rpc:runRpcScenario
          --args="--scenario-id=ci-worker-capability
          --result-dir=ci-results
          --load-interval-millis=100
          --maximum-load-rounds=300
          --request-timeout-millis=120000"
      - name: Summarize Scenario proof
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "- **Scenario RPC:** workers=20, scenarios=6, results=60" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Scenario RPC:** failed; inspect uploaded evidence" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stop Scenario processes
        if: always()
        run: |
          for pid_file in scenario-server.pid scenario-kernel.pid; do
            if [ ! -f "$pid_file" ]; then
              continue
            fi
            pid=$(cat "$pid_file")
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 10); do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            kill -9 "$pid" 2>/dev/null || true
          done
      - name: Upload Scenario evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: scenario-rpc-${{ github.run_attempt }}
          path: |
            scenario-kernel.log
            scenario-server.log
            integrations/worker-capability-rpc/ci-results/**
          if-no-files-found: ignore
          retention-days: 7

  android-host:
    name: Android Host
    needs: changes
    if: >-
      needs.changes.outputs.android_host == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Verify Android Worker and demo host
        run: >-
          ./gradlew --no-daemon --continue
          :transport:android-worker:testDebugUnitTest
          :transport:android-worker:assembleDebug
          :integrations:android-websocket-worker:testDebugUnitTest
          :integrations:android-websocket-worker:assembleDebug
      - name: Verify Android Task RPC host driver
        run: >-
          python -m unittest discover
          -s integrations/android-websocket-worker/host
          -p "test_*.py"
      - name: Summarize Android proof
        if: always()
        run: >-
          python .github/scripts/summarize_junit.py
          --label "Android Host"
          "**/build/test-results/testDebugUnitTest/TEST-*.xml"
      - name: Upload Android failure reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-host-${{ github.run_attempt }}
          path: |
            transport/android-worker/build/test-results/testDebugUnitTest/**
            transport/android-worker/build/reports/tests/testDebugUnitTest/**
            integrations/android-websocket-worker/build/test-results/testDebugUnitTest/**
            integrations/android-websocket-worker/build/reports/tests/testDebugUnitTest/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Summarize Frontend proof
        if: always()
        run: |
          echo "- **Frontend:** ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  proof-gate:
    name: Proof Gate
    if: always()
    needs:
      - changes
      - kernel-oracle
      - jvm-contracts
      - redis-owner
      - runtime-boundary
      - scenario-rpc
      - android-host
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      EVENT_NAME: ${{ github.event_name }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      KERNEL_ORACLE_SELECTED: ${{ needs.changes.outputs.kernel_oracle }}
      KERNEL_ORACLE_RESULT: ${{ needs.kernel-oracle.result }}
      JVM_CONTRACTS_SELECTED: ${{ needs.changes.outputs.jvm_contracts }}
      JVM_CONTRACTS_RESULT: ${{ needs.jvm-contracts.result }}
      REDIS_OWNER_SELECTED: ${{ needs.changes.outputs.redis_owner }}
      REDIS_OWNER_RESULT: ${{ needs.redis-owner.result }}
      RUNTIME_BOUNDARY_SELECTED: ${{ needs.changes.outputs.runtime_boundary }}
      RUNTIME_BOUNDARY_RESULT: ${{ needs.runtime-boundary.result }}
      SCENARIO_RPC_SELECTED: ${{ needs.changes.outputs.scenario_rpc }}
      SCENARIO_RPC_RESULT: ${{ needs.scenario-rpc.result }}
      ANDROID_HOST_SELECTED: ${{ needs.changes.outputs.android_host }}
      ANDROID_HOST_RESULT: ${{ needs.android-host.result }}
      FRONTEND_SELECTED: ${{ needs.changes.outputs.frontend }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
    steps:
      - name: Require every selected proof lane
        shell: bash
        run: |
          failed=0
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change classification failed: $CHANGES_RESULT"
            failed=1
          fi

          check_lane() {
            name=$1
            selected=$2
            result=$3
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              selected=true
            fi
            if [ "$selected" = "true" ]; then
              expected=success
            else
              expected=skipped
            fi
            echo "- **$name:** selected=$selected, result=$result" \
              >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "$expected" ]; then
              echo "$name expected $expected but was $result"
              failed=1
            fi
          }

          check_lane \
            "Kernel Oracle" "$KERNEL_ORACLE_SELECTED" "$KERNEL_ORACLE_RESULT"
          check_lane \
            "JVM Contracts" "$JVM_CONTRACTS_SELECTED" "$JVM_CONTRACTS_RESULT"
          check_lane \
            "Redis Owner" "$REDIS_OWNER_SELECTED" "$REDIS_OWNER_RESULT"
          check_lane \
            "Runtime Boundary" "$RUNTIME_BOUNDARY_SELECTED" "$RUNTIME_BOUNDARY_RESULT"
          check_lane \
            "Scenario RPC" "$SCENARIO_RPC_SELECTED" "$SCENARIO_RPC_RESULT"
          check_lane \
            "Android Host" "$ANDROID_HOST_SELECTED" "$ANDROID_HOST_RESULT"
          check_lane \
            "Frontend" "$FRONTEND_SELECTED" "$FRONTEND_RESULT"

          exit "$failed"
