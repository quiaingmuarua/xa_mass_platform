name: Proof CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: proof-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select proof lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kernel_oracle: ${{ steps.filter.outputs.kernel_oracle }}
      jvm_contracts: ${{ steps.filter.outputs.jvm_contracts }}
      redis_owner: ${{ steps.filter.outputs.redis_owner }}
      runtime_boundary: ${{ steps.filter.outputs.runtime_boundary }}
      worker_fleet: ${{ steps.filter.outputs.worker_fleet }}
      capability_task: ${{ steps.filter.outputs.capability_task }}
      android_host: ${{ steps.filter.outputs.android_host }}
      android_emulator: ${{ steps.filter.outputs.android_emulator }}
      frontend: ${{ steps.filter.outputs.frontend }}
      runtime_distribution: ${{ steps.filter.outputs.runtime_distribution }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify proof selection contract
        run: |
          python3 -m unittest discover \
            -s .github/scripts \
            -p 'test_check_proof_selection.py'
          python3 .github/scripts/check_proof_selection.py
      - id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: .github/proof-paths.yml
          predicate-quantifier: some-with-excludes
  docs-contract:
    name: Docs Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify current documentation contract
        run: python3 .github/scripts/check_docs.py

  kernel-oracle:
    name: Kernel Oracle
    needs: changes
    if: >-
      needs.changes.outputs.kernel_oracle == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KERNEL_DESIGN_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kernel_design/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r kernel_design/requirements.txt
      - name: Run executable specification
        run: >-
          python -m unittest discover
          -s kernel_design/executable_spec/tests
          2>&1 | tee kernel-oracle.log
      - name: Compile Python sources
        run: python -m compileall -q kernel_design/executable_spec
      - name: Summarize Kernel proof
        if: always()
        run: |
          echo "- **Kernel Oracle:** ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Kernel failure log
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kernel-oracle-${{ github.run_attempt }}
          path: kernel-oracle.log
          if-no-files-found: ignore
          retention-days: 7

  jvm-contracts:
    name: JVM Contracts
    needs: changes
    if: >-
      needs.changes.outputs.jvm_contracts == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify JVM contracts and owner boundaries
        run: >-
          ./gradlew --no-daemon --continue
          :transport:worker-delivery-contract:build
          :kernel_jvm:build
          :transport:worker-core:build
          :transport:java-worker:build
          :transport:netty-adapter:build
          :scenario_workers_jvm:build
          :server_jvm:build
          :integrations:worker-capability-task:build
          :integrations:worker-fleet-acceptance:build
      - name: Summarize JVM proof
        if: always()
        run: >-
          python3 .github/scripts/summarize_junit.py
          --label "JVM Contracts"
          "**/build/test-results/test/TEST-*.xml"
      - name: Upload JVM failure reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jvm-contracts-${{ github.run_attempt }}
          path: |
            **/build/test-results/test/**
            **/build/reports/tests/test/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  redis-owner:
    name: Redis Owner
    needs: changes
    if: >-
      needs.changes.outputs.redis_owner == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify Redis owner contracts
        run: >-
          ./gradlew --no-daemon
          :server_jvm:redisOwnerIntegrationTest
      - name: Summarize Redis proof
        if: always()
        run: >-
          python3 .github/scripts/summarize_junit.py
          --label "Redis Owner"
          "server_jvm/build/test-results/redisOwnerIntegrationTest/TEST-*.xml"
      - name: Upload Redis failure reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: redis-owner-${{ github.run_attempt }}
          path: |
            server_jvm/build/test-results/redisOwnerIntegrationTest/**
            server_jvm/build/reports/tests/redisOwnerIntegrationTest/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  runtime-boundary:
    name: Runtime Boundary
    needs: changes
    if: >-
      needs.changes.outputs.runtime_boundary == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kernel_design/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r kernel_design/requirements.txt
      - name: Verify Java-owned Runtime boundary
        run: >-
          ./gradlew --no-daemon
          :server_jvm:runtimeBoundaryIntegrationTest
      - name: Summarize Runtime proof
        if: always()
        run: >-
          python .github/scripts/summarize_junit.py
          --label "Runtime Boundary"
          "server_jvm/build/test-results/runtimeBoundaryIntegrationTest/TEST-*.xml"
      - name: Upload Runtime failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-boundary-${{ github.run_attempt }}
          path: |
            server_jvm/build/test-results/runtimeBoundaryIntegrationTest/**
            server_jvm/build/reports/tests/runtimeBoundaryIntegrationTest/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  worker-fleet:
    name: Worker Fleet
    needs: changes
    if: >-
      needs.changes.outputs.worker_fleet == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XA_MASS_REDIS_SCOPE: test_worker_fleet_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kernel_design/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r kernel_design/requirements.txt
      - name: Build Worker Fleet acceptance artifacts
        run: >-
          ./gradlew --no-daemon
          :server_jvm:bootJar
          :scenario_workers_jvm:installDist
          :integrations:worker-fleet-acceptance:classes
      - name: Prepare isolated Fleet Lab
        run: |
          proof_root="$GITHUB_WORKSPACE/build/worker-fleet-proof"
          mkdir -p "$proof_root/data" "$proof_root/evidence"
          test ! -e "$proof_root/data/scenario-workers"
      - name: Start Server without Scenario Workers
        run: |
          server_jar=$(find server_jvm/build/libs \
            -name 'xa-mass-server-jvm-*.jar' \
            ! -name '*-plain.jar' -print -quit)
          test -n "$server_jar"
          proof_root="$GITHUB_WORKSPACE/build/worker-fleet-proof"
          java -jar "$server_jar" \
            --spring.profiles.active=scenario-workers \
            --xa.mass.kernel-pacer.config-path=integrations/worker-capability-task/kernel-config.json \
            --xa.mass.kernel-pacer.state-directory="$proof_root/kernel-pacer" \
            > fleet-server.log 2>&1 &
          echo $! > fleet-server.pid
          for _ in $(seq 1 90); do
            if python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18082/actuator/health/readiness')" \
              >/dev/null 2>&1; then
              cp "$proof_root/kernel-pacer/owner.json" \
                "$proof_root/initial-pacer-owner.json"
              break
            fi
            sleep 1
          done
          test -f "$proof_root/initial-pacer-owner.json" || {
            cat fleet-server.log
            exit 1
          }
          python - <<'PY'
          import json
          import urllib.request

          for group in (
              "scenario-phone-number-workers",
              "scenario-string-utils-workers",
          ):
              request = urllib.request.Request(
                  "http://127.0.0.1:18082/api/v1/runtime-view/worker-groups/"
                  f"{group}/workers:preview",
                  data=json.dumps({"sampleLimit": 100}).encode(),
                  method="POST",
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request) as response:
                  workers = json.load(response)["workers"]
              if workers:
                  raise SystemExit(f"Server implicitly started Workers for {group}")
          PY
      - name: Start initial Scenario Worker Host
        run: |
          proof_root="$GITHUB_WORKSPACE/build/worker-fleet-proof"
          java -cp "scenario_workers_jvm/build/install/xa-mass-scenario-workers/lib/*" \
            com.xa.mass.scenarioworkers.ScenarioWorkerHostMain \
            --runtime-api-base-url=http://127.0.0.1:18082 \
            --sandbox-root="$proof_root/data/scenario-workers" \
            > fleet-host-initial.log 2>&1 &
          echo $! > fleet-host.pid
      - name: Prove initial Worker Fleet
        run: >-
          ./gradlew --no-daemon
          :integrations:worker-fleet-acceptance:runFleetAcceptance
          --args="--phase=initial
          --proof-id=ci-worker-fleet
          --server-base-url=http://127.0.0.1:18082
          --fleet-spec=$GITHUB_WORKSPACE/integrations/worker-fleet-acceptance/fleet-spec.json
          --scenario-worker-lab-root=$GITHUB_WORKSPACE/build/worker-fleet-proof/data/scenario-workers
          --evidence-file=$GITHUB_WORKSPACE/build/worker-fleet-proof/evidence/initial.json
          --maximum-wait-millis=30000
          --request-timeout-millis=120000"
      - name: Stop initial Host gracefully
        run: |
          proof_root="$GITHUB_WORKSPACE/build/worker-fleet-proof"
          child_pid=$(python -c \
            "import json; print(json.load(open('$proof_root/kernel-pacer/owner.json'))['pid'])")
          server_pid=$(cat fleet-server.pid)
          pid=$(cat fleet-host.pid)
          kill "$pid"
          stopped=false
          for _ in $(seq 1 15); do
            if ! kill -0 "$pid" 2>/dev/null; then
              stopped=true
              break
            fi
            sleep 1
          done
          if [ "$stopped" != true ]; then
            kill -9 "$pid" 2>/dev/null || true
            rm -f fleet-host.pid
            echo "Scenario Worker Host did not stop within 15 seconds"
            exit 1
          fi
          rm -f fleet-host.pid
          kill -0 "$server_pid"
          kill -0 "$child_pid"
          python -c \
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18082/actuator/health/readiness')"
      - name: Restart the same Scenario Worker Host
        run: |
          proof_root="$GITHUB_WORKSPACE/build/worker-fleet-proof"
          java -cp "scenario_workers_jvm/build/install/xa-mass-scenario-workers/lib/*" \
            com.xa.mass.scenarioworkers.ScenarioWorkerHostMain \
            --runtime-api-base-url=http://127.0.0.1:18082 \
            --sandbox-root="$proof_root/data/scenario-workers" \
            > fleet-host-restart.log 2>&1 &
          echo $! > fleet-host.pid
      - name: Prove restarted Worker Fleet
        run: >-
          ./gradlew --no-daemon
          :integrations:worker-fleet-acceptance:runFleetAcceptance
          --args="--phase=restart
          --proof-id=ci-worker-fleet
          --server-base-url=http://127.0.0.1:18082
          --fleet-spec=$GITHUB_WORKSPACE/integrations/worker-fleet-acceptance/fleet-spec.json
          --scenario-worker-lab-root=$GITHUB_WORKSPACE/build/worker-fleet-proof/data/scenario-workers
          --evidence-file=$GITHUB_WORKSPACE/build/worker-fleet-proof/evidence/restart.json
          --baseline-file=$GITHUB_WORKSPACE/build/worker-fleet-proof/evidence/initial.json
          --maximum-wait-millis=30000
          --request-timeout-millis=120000"
      - name: Summarize Worker Fleet proof
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "- **Worker Fleet:** replicas=20, connected=20, probe=20, properties=20, restartIdentity=matched" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Worker Fleet:** failed; inspect safe evidence and process logs" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stop Worker Fleet processes
        if: always()
        run: |
          for pid_file in fleet-host.pid fleet-server.pid; do
            if [ ! -f "$pid_file" ]; then
              continue
            fi
            pid=$(cat "$pid_file")
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 15); do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            kill -9 "$pid" 2>/dev/null || true
          done
      - name: Clean exact Worker Fleet Redis scope
        if: always()
        run: >-
          python .github/scripts/cleanup_redis_test_scope.py
          --redis-url redis://127.0.0.1:6379/15
          --scope "$XA_MASS_REDIS_SCOPE"
      - name: Upload Worker Fleet evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: worker-fleet-${{ github.run_attempt }}
          path: |
            build/worker-fleet-proof/evidence/*.json
            fleet-server.log
            fleet-host-initial.log
            fleet-host-restart.log
          if-no-files-found: ignore
          retention-days: 7

  capability-task:
    name: Capability Task
    needs: changes
    if: >-
      needs.changes.outputs.capability_task == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XA_MASS_REDIS_SCOPE: test_capability_task_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kernel_design/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r kernel_design/requirements.txt
      - name: Build Capability Task acceptance artifacts
        run: >-
          ./gradlew --no-daemon
          :server_jvm:bootJar
          :scenario_workers_jvm:installDist
          :integrations:worker-capability-task:classes
      - name: Start Server
        run: |
          SERVER_JAR=$(find server_jvm/build/libs \
            -name 'xa-mass-server-jvm-*.jar' \
            ! -name '*-plain.jar' -print -quit)
          test -n "$SERVER_JAR"
          java -jar "$SERVER_JAR" \
            --spring.profiles.active=scenario-workers \
            --xa.mass.kernel-pacer.config-path=integrations/worker-capability-task/kernel-config.json \
            > scenario-server.log 2>&1 &
          echo $! > scenario-server.pid
          for _ in $(seq 1 90); do
            if python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18082/actuator/health/readiness')" \
              >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat scenario-server.log
          exit 1
      - name: Start Scenario Worker Host
        run: |
          java -cp "scenario_workers_jvm/build/install/xa-mass-scenario-workers/lib/*" \
            com.xa.mass.scenarioworkers.ScenarioWorkerHostMain \
            --runtime-api-base-url=http://127.0.0.1:18082 \
            --sandbox-root="$GITHUB_WORKSPACE/build/capability-task-proof/data/scenario-workers" \
            > scenario-worker-host.log 2>&1 &
          echo $! > scenario-worker-host.pid
      - name: Verify 2 finite Tasks and 60 Results
        run: >-
          ./gradlew --no-daemon
          :integrations:worker-capability-task:runCapabilityTaskScenario
          --args="--proof-id=ci-worker-capability
          --result-dir=ci-results
          --maximum-wait-millis=30000
          --request-timeout-millis=120000"
      - name: Summarize Capability Task proof
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "- **Capability Task:** tasks=2, submitted=60, exported=60" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Capability Task:** failed; inspect uploaded evidence" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stop Scenario processes
        if: always()
        run: |
          for pid_file in scenario-worker-host.pid scenario-server.pid; do
            if [ ! -f "$pid_file" ]; then
              continue
            fi
            pid=$(cat "$pid_file")
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 10); do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            kill -9 "$pid" 2>/dev/null || true
          done
      - name: Clean exact Capability Task Redis scope
        if: always()
        run: >-
          python .github/scripts/cleanup_redis_test_scope.py
          --redis-url redis://127.0.0.1:6379/15
          --scope "$XA_MASS_REDIS_SCOPE"
      - name: Upload Capability Task evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: capability-task-${{ github.run_attempt }}
          path: |
            scenario-server.log
            scenario-worker-host.log
            integrations/worker-capability-task/ci-results/**
          if-no-files-found: ignore
          retention-days: 7

  android-host:
    name: Android Host
    needs: changes
    if: >-
      needs.changes.outputs.android_host == 'true' ||
      needs.changes.outputs.android_emulator == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Verify Android Worker and demo host
        run: >-
          ./gradlew --no-daemon --continue
          :transport:android-worker:testDebugUnitTest
          :transport:android-worker:assembleDebug
          :xa-android:capabilities:testDebugUnitTest
          :xa-android:capabilities:assembleDebug
          :xa-android:capability-http:testDebugUnitTest
          :xa-android:capability-http:assembleDebug
          :xa-android:worker-demo:testDebugUnitTest
          :xa-android:worker-demo:assembleDebug
      - name: Verify Android Task RPC host driver
        run: >-
          python -m unittest discover
          -s xa-android/worker-demo/host
          -p "test_*.py"
      - name: Upload Android Worker Demo APK
        if: >-
          needs.changes.outputs.android_emulator == 'true' ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-worker-demo-apk
          path: xa-android/worker-demo/build/outputs/apk/debug/xa-mass-android-worker-demo-debug.apk
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Summarize Android proof
        if: always()
        run: >-
          python .github/scripts/summarize_junit.py
          --label "Android Host"
          "**/build/test-results/testDebugUnitTest/TEST-*.xml"
      - name: Upload Android failure reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-host-${{ github.run_attempt }}
          path: |
            transport/android-worker/build/test-results/testDebugUnitTest/**
            transport/android-worker/build/reports/tests/testDebugUnitTest/**
            xa-android/capabilities/build/test-results/testDebugUnitTest/**
            xa-android/capabilities/build/reports/tests/testDebugUnitTest/**
            xa-android/capability-http/build/test-results/testDebugUnitTest/**
            xa-android/capability-http/build/reports/tests/testDebugUnitTest/**
            xa-android/worker-demo/build/test-results/testDebugUnitTest/**
            xa-android/worker-demo/build/reports/tests/testDebugUnitTest/**
            build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7

  android-emulator-worker:
    name: Android Emulator Worker
    needs:
      - changes
      - android-host
    if: >-
      always() &&
      (needs.changes.outputs.android_emulator == 'true' ||
      github.event_name == 'workflow_dispatch') &&
      needs.android-host.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: android-emulator-worker-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANDROID_API_LEVEL: "33"
      ANDROID_WORKER_PROOF_ROOT: ${{ github.workspace }}/build/android-emulator-proof
      ANDROID_WORKER_APK: ${{ github.workspace }}/build/android-emulator-proof/apk/xa-mass-android-worker-demo-debug.apk
      XA_MASS_REDIS_SCOPE: test_android_emulator_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kernel_design/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r kernel_design/requirements.txt
      - name: Download Android Worker Demo APK
        uses: actions/download-artifact@v8.0.0
        with:
          name: android-worker-demo-apk
          path: build/android-emulator-proof/apk
      - name: Build Scenario Server
        run: ./gradlew --no-daemon :server_jvm:bootJar
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove Android Worker on API 33 Emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none
          script: bash .github/scripts/run_android_emulator_worker.sh
      - name: Clean exact Android Redis scope
        if: always()
        run: >-
          python .github/scripts/cleanup_redis_test_scope.py
          --redis-url redis://127.0.0.1:6379/15
          --scope "$XA_MASS_REDIS_SCOPE"
      - name: Summarize Android Emulator Worker proof
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "- **Android Emulator Worker:** API=33, lifecycle=closed, identity=stable, route=connected, probe=observed, processRestart=matched" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Android Emulator Worker:** failed; inspect safe evidence and filtered logs" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Android Emulator Worker evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-emulator-worker-${{ github.run_attempt }}
          path: |
            build/android-emulator-proof/evidence/*.json
            build/android-emulator-proof/logs/server-*.log
            build/android-emulator-proof/logs/android-filtered.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Summarize Frontend proof
        if: always()
        run: |
          echo "- **Frontend:** ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"

  runtime-distribution:
    name: Runtime Distribution
    needs: changes
    if: >-
      needs.changes.outputs.runtime_distribution == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XA_MASS_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11.3"
          cache: pip
          cache-dependency-path: |
            kernel_design/pyproject.toml
            kernel_design/requirements-runtime.lock
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build and prove unpacked Runtime archive
        run: >-
          ./gradlew --no-daemon
          :distribution:server:runtimeDistributionTest
          -PxaMassVersion=0.2.0
      - name: Summarize Runtime Distribution proof
        if: always()
        run: |
          echo "- **Runtime Distribution:** ${{ job.status }}" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Runtime archive
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: xa-mass-server-runtime-${{ github.run_attempt }}
          path: distribution/server/build/distributions/xa-mass-server-runtime-0.2.0.zip
          if-no-files-found: ignore
          retention-days: 7

  proof-gate:
    name: Proof Gate
    if: always()
    needs:
      - changes
      - kernel-oracle
      - jvm-contracts
      - redis-owner
      - runtime-boundary
      - worker-fleet
      - capability-task
      - android-host
      - android-emulator-worker
      - frontend
      - runtime-distribution
      - docs-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      EVENT_NAME: ${{ github.event_name }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      KERNEL_ORACLE_SELECTED: ${{ needs.changes.outputs.kernel_oracle }}
      KERNEL_ORACLE_RESULT: ${{ needs.kernel-oracle.result }}
      JVM_CONTRACTS_SELECTED: ${{ needs.changes.outputs.jvm_contracts }}
      JVM_CONTRACTS_RESULT: ${{ needs.jvm-contracts.result }}
      REDIS_OWNER_SELECTED: ${{ needs.changes.outputs.redis_owner }}
      REDIS_OWNER_RESULT: ${{ needs.redis-owner.result }}
      RUNTIME_BOUNDARY_SELECTED: ${{ needs.changes.outputs.runtime_boundary }}
      RUNTIME_BOUNDARY_RESULT: ${{ needs.runtime-boundary.result }}
      WORKER_FLEET_SELECTED: ${{ needs.changes.outputs.worker_fleet }}
      WORKER_FLEET_RESULT: ${{ needs.worker-fleet.result }}
      CAPABILITY_TASK_SELECTED: ${{ needs.changes.outputs.capability_task }}
      CAPABILITY_TASK_RESULT: ${{ needs.capability-task.result }}
      ANDROID_HOST_SELECTED: ${{ needs.changes.outputs.android_host == 'true' || needs.changes.outputs.android_emulator == 'true' }}
      ANDROID_HOST_RESULT: ${{ needs.android-host.result }}
      ANDROID_EMULATOR_SELECTED: ${{ needs.changes.outputs.android_emulator }}
      ANDROID_EMULATOR_RESULT: ${{ needs.android-emulator-worker.result }}
      FRONTEND_SELECTED: ${{ needs.changes.outputs.frontend }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      RUNTIME_DISTRIBUTION_SELECTED: ${{ needs.changes.outputs.runtime_distribution }}
      RUNTIME_DISTRIBUTION_RESULT: ${{ needs.runtime-distribution.result }}
      DOCS_RESULT: ${{ needs.docs-contract.result }}
    steps:
      - name: Require every selected proof lane
        shell: bash
        run: |
          failed=0
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change classification failed: $CHANGES_RESULT"
            failed=1
          fi

          check_lane() {
            name=$1
            selected=$2
            result=$3
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              selected=true
            fi
            if [ "$selected" = "true" ]; then
              expected=success
            else
              expected=skipped
            fi
            echo "- **$name:** selected=$selected, result=$result" \
              >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "$expected" ]; then
              echo "$name expected $expected but was $result"
              failed=1
            fi
          }

          check_lane \
            "Kernel Oracle" "$KERNEL_ORACLE_SELECTED" "$KERNEL_ORACLE_RESULT"
          check_lane \
            "JVM Contracts" "$JVM_CONTRACTS_SELECTED" "$JVM_CONTRACTS_RESULT"
          check_lane \
            "Redis Owner" "$REDIS_OWNER_SELECTED" "$REDIS_OWNER_RESULT"
          check_lane \
            "Runtime Boundary" "$RUNTIME_BOUNDARY_SELECTED" "$RUNTIME_BOUNDARY_RESULT"
          check_lane \
            "Worker Fleet" "$WORKER_FLEET_SELECTED" "$WORKER_FLEET_RESULT"
          check_lane \
            "Capability Task" "$CAPABILITY_TASK_SELECTED" "$CAPABILITY_TASK_RESULT"
          check_lane \
            "Android Host" "$ANDROID_HOST_SELECTED" "$ANDROID_HOST_RESULT"
          check_lane \
            "Android Emulator Worker" "$ANDROID_EMULATOR_SELECTED" "$ANDROID_EMULATOR_RESULT"
          check_lane \
            "Frontend" "$FRONTEND_SELECTED" "$FRONTEND_RESULT"
          check_lane \
            "Runtime Distribution" "$RUNTIME_DISTRIBUTION_SELECTED" "$RUNTIME_DISTRIBUTION_RESULT"
          check_lane \
            "Docs Contract" "true" "$DOCS_RESULT"

          exit "$failed"
