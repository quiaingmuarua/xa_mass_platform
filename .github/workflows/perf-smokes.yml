name: Perf Smokes

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

jobs:
  perf-smokes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Run perf smoke bundle
        env:
          MASS_WORKLOAD_SMOKE_SCENARIO_ID: "workload-mix-slow-bulk-interactive-isolation"
        run: bash xa-mass-testing/scripts/run-perf-smokes.sh
      - name: Write proof summary
        if: always()
        run: >-
          node xa-mass-testing/scripts/write-proof-summary.mjs
          --job perf-smokes
          --perf-dir xa-mass-testing/target/perf-reports
      - name: Upload perf smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-reports
          path: |
            xa-mass-testing/target/perf-reports/
            xa-mass-testing/target/proof-summary/**
          if-no-files-found: warn
