name: Setup Node and pnpm
description: Configure pnpm 11.9.0 and Node 22.19.0 with frontend lockfile cache.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.0.10
      with:
        version: 11.9.0
        run_install: false
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 22.19.0
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
